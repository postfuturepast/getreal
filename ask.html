<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask GetReal — buying coach</title>
  <meta name="description" content="Chat with GetReal's buying coach. Tell us your situation and find out what you can actually spend on a property.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      background: #0e0e0e;
      color: #e5e5e5;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .ask-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #1e1e1e;
      background: #0e0e0e;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .ask-header-logo {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }
    .ask-header-tag {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
      margin-left: auto;
    }

    /* ── Chat area ── */
    .chat-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .msg-sender {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #444;
    }
    .msg.from-getreal .msg-sender { color: #3b82f6; }
    .msg.from-user    .msg-sender { color: #555; }

    .msg-body {
      font-size: 0.82rem;
      line-height: 1.7;
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.from-getreal .msg-body { color: #e5e5e5; }
    .msg.from-user    .msg-body { color: #999; }

    /* ── Opening options ── */
    .opening-opts {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.25rem;
    }
    .opt-btn {
      background: #141414;
      border: 1px solid #252525;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      text-align: left;
      padding: 0.7rem 0.9rem;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
      line-height: 1.4;
    }
    .opt-btn:hover { border-color: #3b82f6; background: #111; color: #fff; }

    /* ── Tool result block ── */
    .tool-result {
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 3px solid #3b82f6;
      padding: 0.85rem 1rem;
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .tool-result-label {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3b82f6;
      font-weight: 700;
    }
    .tool-result-ceiling {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .tool-result-rows {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      margin-top: 0.25rem;
    }
    .tool-result-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #666;
      border-bottom: 1px solid #1a1a1a;
      padding: 0.2rem 0;
    }
    .tool-result-row.binding {
      color: #d4d4d4;
      font-weight: 700;
    }
    .tool-result-row.binding .tr-val { color: #fff; }
    .tr-label { color: inherit; }
    .tr-val   { font-weight: 600; }

    /* ── Typing indicator ── */
    .thinking {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .thinking .msg-sender { color: #3b82f6; }
    .thinking-dots {
      font-size: 0.75rem;
      color: #3b82f6;
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ── Input area ── */
    .input-area {
      border-top: 1px solid #1a1a1a;
      background: #0e0e0e;
      padding: 0.9rem 1.25rem;
      position: sticky;
      bottom: 0;
    }
    .input-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .input-textarea {
      flex: 1;
      background: #141414;
      border: 1px solid #252525;
      color: #e5e5e5;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      padding: 0.65rem 0.85rem;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.1s;
    }
    .input-textarea:focus { border-color: #3b82f6; }
    .input-textarea::placeholder { color: #444; }
    .send-btn {
      background: #3b82f6;
      border: none;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.65rem 1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
      height: 44px;
    }
    .send-btn:hover:not(:disabled) { background: #2563eb; }
    .send-btn:disabled { background: #1e2d46; color: #3b82f6; cursor: not-allowed; }

    /* ── Error ── */
    .error-msg {
      background: #1a0606;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-size: 0.72rem;
      padding: 0.6rem 0.85rem;
    }

    @media (max-width: 480px) {
      .chat-wrap  { padding: 1rem 0.85rem; }
      .input-area { padding: 0.75rem 0.85rem; }
      .tool-result-ceiling { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="ask-header">
  <a class="ask-header-logo" href="/">GetReal</a>
  <span class="ask-header-tag">Buying coach</span>
</div>

<div class="chat-wrap" id="chat"></div>

<div class="input-area">
  <div class="input-inner">
    <textarea
      id="user-input"
      class="input-textarea"
      placeholder="Tell me about your situation…"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>Send</button>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let conversationHistory = [];  // Gemini-format messages array
let waiting = false;
let openingDone = false;

// ─── Formatters ───────────────────────────────────────────────────────────────
function fmtMoney(n) {
  if (!n || isNaN(n)) return '$0';
  return '$' + Math.round(n).toLocaleString('en-AU');
}

// ─── DOM helpers ──────────────────────────────────────────────────────────────
function chatEl() { return document.getElementById('chat'); }

function appendMsg(role, text, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'assistant' ? 'from-getreal' : 'from-user');

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = role === 'assistant' ? 'GETREAL' : 'YOU';

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.textContent = text;

  wrap.appendChild(sender);
  wrap.appendChild(body);

  if (opts.options) {
    const optWrap = document.createElement('div');
    optWrap.className = 'opening-opts';
    opts.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => { optWrap.remove(); sendUserMessage(opt); };
      optWrap.appendChild(btn);
    });
    wrap.appendChild(optWrap);
  }

  if (opts.toolResult) {
    wrap.appendChild(buildToolResultBlock(opts.toolResult));
  }

  chatEl().appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function appendThinking() {
  const wrap = document.createElement('div');
  wrap.className = 'thinking';
  wrap.id = 'thinking-indicator';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = 'GETREAL';

  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.textContent = 'Thinking…';

  wrap.appendChild(sender);
  wrap.appendChild(dots);
  chatEl().appendChild(wrap);
  scrollToBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function scrollToBottom() {
  const c = chatEl();
  c.scrollTop = c.scrollHeight;
}

function buildToolResultBlock(result) {
  const block = document.createElement('div');
  block.className = 'tool-result';

  const label = document.createElement('div');
  label.className = 'tool-result-label';
  label.textContent = 'Deposit ceiling';
  block.appendChild(label);

  if (result.error) {
    const msg = document.createElement('div');
    msg.style.cssText = 'font-size:0.72rem;color:#fca5a5;margin-top:0.25rem;';
    msg.textContent = result.error;
    block.appendChild(msg);
    return block;
  }

  if (result.maxPrice > 0) {
    const ceiling = document.createElement('div');
    ceiling.className = 'tool-result-ceiling';
    ceiling.textContent = fmtMoney(result.maxPrice);
    block.appendChild(ceiling);

    const rows = document.createElement('div');
    rows.className = 'tool-result-rows';

    const addRow = (lbl, value, highlight = false) => {
      const r = document.createElement('div');
      r.className = 'tool-result-row' + (highlight ? ' binding' : '');
      r.innerHTML = `<span class="tr-label">${lbl}</span><span class="tr-val">${value}</span>`;
      rows.appendChild(r);
    };

    addRow('Stamp duty', fmtMoney(result.stampDuty));
    if (result.lmiPremium > 0) addRow('LMI (capitalised)', fmtMoney(result.lmiPremium));
    addRow('LVR tier', Math.round(result.lvrTier * 100) + '%');

    block.appendChild(rows);

    const note = document.createElement('div');
    note.style.cssText = 'font-size:0.65rem;color:#555;margin-top:0.6rem;line-height:1.4;';
    note.textContent = 'Deposit ceiling only. Income and debts may reduce this further.';
    block.appendChild(note);

    const link = document.createElement('a');
    link.href = '/deposit.html';
    link.style.cssText = 'display:inline-block;margin-top:0.5rem;font-size:0.65rem;color:#3b82f6;text-decoration:none;letter-spacing:0.05em;text-transform:uppercase;';
    link.textContent = 'Full calculator →';
    block.appendChild(link);
  }

  return block;
}

// ─── Send ─────────────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!waiting) sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  document.getElementById('send-btn').disabled = !el.value.trim() || waiting;
}

function sendMessage() {
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text || waiting) return;
  inp.value = '';
  inp.style.height = '';
  document.getElementById('send-btn').disabled = true;
  sendUserMessage(text);
}

async function sendUserMessage(text) {
  if (waiting) return;
  waiting = true;

  appendMsg('user', text);

  // Add to history
  conversationHistory.push({ role: 'user', parts: [{ text }] });

  appendThinking();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory }),
    });

    if (!res.ok) {
      const rawText = await res.text().catch(() => '');
      let errMsg = `HTTP ${res.status}`;
      try {
        const err = JSON.parse(rawText);
        errMsg = err.detail || err.error || errMsg;
      } catch(e) {
        if (rawText) errMsg = rawText.substring(0, 300);
      }
      removeThinking();
      appendMsg('assistant', 'Something went wrong. Please try again.');
      appendError(errMsg);
      waiting = false;
      document.getElementById('send-btn').disabled = false;
      return;
    }

    const data = await res.json();
    removeThinking();

    const reply = data.reply || '';
    const toolResult = data.toolResult || null;

    // Add model response to history
    if (reply) {
      conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
    }

    appendMsg('assistant', reply, { toolResult });

  } catch (err) {
    removeThinking();
    appendMsg('assistant', 'Could not reach the GetReal server. Check your connection and try again.');
    appendError(err.message);
  }

  waiting = false;
  const inp = document.getElementById('user-input');
  document.getElementById('send-btn').disabled = !inp.value.trim();
}

function appendError(msg) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = msg;
  chatEl().appendChild(el);
  scrollToBottom();
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
function boot() {
  const openingOptions = [
    'How much can I borrow?',
    'What\'s my buying ceiling with $120k saved?',
    'How does the deposit ceiling work?',
    'I\'m a first home buyer — where do I start?',
  ];

  appendMsg('assistant', 'What do you want to know?', { options: openingOptions });

  // Enable input after opening
  document.getElementById('user-input').addEventListener('input', function () {
    document.getElementById('send-btn').disabled = !this.value.trim() || waiting;
  });
}

boot();
</script>
</body>
</html>
