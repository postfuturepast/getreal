<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>GetReal — buying coach</title>
  <meta name="description" content="Tell GetReal where you are in your property journey. Work out your maximum budget, check if a property is realistic, and more.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      background: #0e0e0e;
      color: #e5e5e5;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .back-btn {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      padding: 0;
      margin-left: auto;
      display: none;
    }
    .back-btn:hover { color: #18181b; }

    /* ── Tool choice quick replies ── */
    .tool-choices {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.6rem;
    }
    .tool-choice-btn {
      background: #141414;
      border: 1px solid #252525;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.1s, background 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .tool-choice-btn:hover { border-color: #3b82f6; background: #0f1823; color: #fff; }
    .tool-choice-btn.disabled { opacity: 0.45; cursor: default; }
    .tool-choice-btn.disabled:hover { border-color: #252525; background: #141414; color: #d4d4d4; }
    .tool-choice-label { font-weight: 600; }
    .tool-choice-tag { font-size: 0.58rem; color: #555; letter-spacing: 0.08em; white-space: nowrap; }

    /* ── Chat area ── */
    .chat-outer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .chat-wrap {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .msg-sender {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #444;
    }
    .msg.from-getreal .msg-sender { color: #3b82f6; }
    .msg.from-user    .msg-sender { display: none; }
    .msg-body {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* GETREAL: dark card bubble */
    .msg.from-getreal .msg-body {
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      padding: 0.6rem 0.85rem;
      color: #e5e5e5;
    }
    /* User: right-aligned blue bubble */
    .msg.from-user {
      align-self: flex-end;
      align-items: flex-end;
      max-width: 72%;
    }
    .msg.from-user .msg-body {
      background: #0c1f3d;
      border: 1px solid #1a3560;
      padding: 0.6rem 0.85rem;
      color: #cce0ff;
    }

    /* ── Quick reply buttons ── */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .qr-btn {
      background: #141414;
      border: 1px solid #252525;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
    }
    .qr-btn:hover { border-color: #3b82f6; background: #111; color: #fff; }
    .qr-btn.primary { border-color: #3b82f6; color: #3b82f6; }
    .qr-btn.primary:hover { background: #3b82f6; color: #fff; }

    /* ── Step reveal cards ── */
    .step-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 2px solid #252525;
      padding: 0.65rem 0.9rem;
      margin-top: 0.3rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }
    .step-card-label {
      font-size: 0.68rem;
      color: #aaa;
    }
    .step-card-value {
      font-size: 0.82rem;
      color: #e5e5e5;
      font-weight: 600;
      text-align: right;
    }
    .step-card-value.negative { color: #f87171; }
    .step-card-value.result   { color: #fff; font-size: 1.1rem; }

    /* ── Big reveal card ── */
    .reveal-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 3px solid #3b82f6;
      padding: 0.9rem 1rem;
      margin-top: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .reveal-label {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3b82f6;
      font-weight: 700;
    }
    .reveal-price {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .reveal-sub {
      font-size: 0.65rem;
      color: #888;
      margin-top: 0.25rem;
      line-height: 1.5;
    }

    /* ── Typing indicator ── */
    .thinking {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .thinking .msg-sender { color: #3b82f6; font-size: 0.55rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .thinking-dots {
      font-size: 0.75rem;
      color: #3b82f6;
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ── Input area ── */
    .input-area {
      border-top: 1px solid #1a1a1a;
      background: #0e0e0e;
      padding: 0.9rem 1.25rem;
      position: sticky;
      bottom: 0;
    }
    .input-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .input-textarea {
      flex: 1;
      background: #141414;
      border: 1px solid #252525;
      color: #e5e5e5;
      font-family: 'Courier New', monospace;
      font-size: 16px; /* must be ≥16px to prevent iOS Safari zoom on focus */
      line-height: 1.5;
      padding: 0.65rem 0.85rem;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.1s;
    }
    .input-textarea:focus { border-color: #3b82f6; }
    .input-textarea::placeholder { color: #444; }
    .send-btn {
      background: #3b82f6;
      border: none;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.65rem 1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
      height: 44px;
    }
    .send-btn:hover:not(:disabled) { background: #2563eb; }
    .send-btn:disabled { background: #1e2d46; color: #3b82f6; cursor: not-allowed; }

    /* ── Debt type multi-select ── */
    .debt-toggles {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }
    .debt-toggle {
      background: #141414;
      border: 1px solid #252525;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.1s, background 0.1s;
    }
    .debt-toggle:hover { border-color: #3b82f6; }
    .debt-toggle.selected { border-color: #3b82f6; background: #0f1823; color: #fff; }
    .debt-toggle-none { color: #888; border-style: dashed; margin-top: 0.2rem; }
    .debt-toggle-none:hover { color: #e5e5e5; }

    /* ── Error ── */
    .error-msg {
      background: #1a0606;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-size: 0.72rem;
      padding: 0.6rem 0.85rem;
    }

    @media (max-width: 480px) {
      .journey-grid { grid-template-columns: 1fr; }
      .chat-wrap { padding: 1rem 0.85rem; }
      .input-area { padding: 0.75rem 0.85rem; }
      .reveal-price { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <svg width="22" height="22" viewBox="0 0 26 26" fill="none">
      <circle cx="13" cy="13" r="11.5" stroke="#18181b" stroke-width="1.5"/>
      <circle cx="13" cy="13" r="6.5" stroke="#18181b" stroke-width="1.5"/>
      <circle cx="13" cy="13" r="2.5" fill="#18181b"/>
    </svg>
    <span class="brand-name">GetReal</span>
  </a>
  <button class="back-btn" id="back-btn" onclick="goBack()" style="display:none">← Start over</button>
</header>

<div class="chat-outer" id="chat-outer">
  <div class="chat-wrap" id="chat"></div>
</div>

<div class="input-area" id="input-area">
  <div class="input-inner">
    <textarea
      id="user-input"
      class="input-textarea"
      placeholder="Type a message…"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this); liveFormatNumber(this)"
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>Send</button>
  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://lkxzxeeeqfiymunpqvgt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1jyBD0hVdHX2ieqFIlC51A_A3ep39Bc';

// ─── State ────────────────────────────────────────────────────────────────────
let journey           = null;   // 'budget' | 'realism' | 'mortgage' | 'selling'
let knownFHB          = false;  // true when journey selection already answered the FHB question
let journeyType       = null;   // 'budget' | 'realism' — sent to API to select system prompt
let isAffordabilityMode = false; // true when user wants "can I afford $X?" — runs all 3 checks
let waiting      = false;
let conversationHistory = [];
let postCalcPhase = null;       // null | 'ask-enough' | 'ask-target' | 'ask-power' | 'done'
let lastCalcResult = null;
let lastSvcResult  = null;
let awaitingEmail = false;
let suburbPhase = null;         // null | 'awaiting' | 'loading' | 'done'
let suburbName  = null;

// ─── Structured intake flow state ─────────────────────────────────────────────
// Used by the "Show me my maximum" and "Can I afford it" structured flows.
// Phases: sf-price, sf-state, sf-fhb, sf-suburb, sf-proptype, sf-oo, sf-savings, sf-calculating
const sf = { mode: null, phase: null, price: null, state: null, isFirstHomeBuyer: null, suburb: null, propertyType: null, isOwnerOccupier: null, savings: null };
function sfReset() { sf.mode = null; sf.phase = null; sf.price = null; sf.state = null; sf.isFirstHomeBuyer = null; sf.suburb = null; sf.propertyType = null; sf.isOwnerOccupier = null; sf.savings = null; }

// ─── Formatters ───────────────────────────────────────────────────────────────
function fmtMoney(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Math.round(n).toLocaleString('en-AU');
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n * 100) + '%';
}

// ─── DOM ──────────────────────────────────────────────────────────────────────
function chatEl()  { return document.getElementById('chat'); }
function scrollToBottom() {
  const outer = document.getElementById('chat-outer');
  outer.scrollTop = outer.scrollHeight;
}

function goBack() {
  journey = null;
  knownFHB = false;
  journeyType = null;
  isAffordabilityMode = false;
  waiting = false;
  conversationHistory = [];
  postCalcPhase = null;
  lastCalcResult = null;
  awaitingEmail = false;
  revealResult = null;
  userDTIResponse = null;
  dtiPhase = null;
  dtiSelectedDebts = [];
  dtiDebtAmounts = {};
  lastDTIResult = null;
  svcPhase = null; svcTakeHome1 = 0; svcTakeHome2 = 0; svcDependants = 0; svcLocationType = 'metro';
  lastSvcResult = null;
  suburbPhase = null;
  suburbName  = null;
  sfReset();
  chatEl().innerHTML = '';
  document.getElementById('user-input').value = '';
  document.getElementById('user-input').style.height = '';
  document.getElementById('user-input').placeholder = 'Type a message…';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('back-btn').style.display = 'none';
  boot();
}

// ─── Boot — show opening message + tool choices ───────────────────────────────
function boot() {
  const wrap = appendGetReal('Where are you in your property journey?');

  const choices = document.createElement('div');
  choices.className = 'tool-choices';

  const tools = [
    { key: 'budget-fhb', label: "Looking to buy my first home"     },
    { key: 'budget',     label: "Wondering what I could afford"   },
    { key: 'realism-chat',   label: "Browsing properties online"  },
    { key: 'affordability', label: "Going to inspections"         },
    { key: 'mortgage',  label: "Trying to pay my mortgage down"   },
    { key: 'selling',   label: "Thinking of selling"              },
  ];

  tools.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tool-choice-btn';
    btn.innerHTML = `<span class="tool-choice-label">${t.label}</span>`;
    btn.onclick = () => {
      choices.remove();
      selectJourney(t.key, t.label);
    };
    choices.appendChild(btn);
  });

  wrap.appendChild(choices);

  const alpha = document.createElement('div');
  alpha.style.cssText = 'margin-top:0.9rem;font-size:0.62rem;letter-spacing:0.08em;color:#444;text-transform:uppercase;';
  alpha.textContent = 'Alpha · Results are estimates only · Not financial advice';
  wrap.appendChild(alpha);

  scrollToBottom();
}

// ─── Journey selection ────────────────────────────────────────────────────────
function selectJourney(j, label) {
  if (j === 'budget-fhb')   { j = 'budget';  knownFHB = true; }
  if (j === 'realism-chat') { j = 'realism'; journeyType = 'realism'; }
  else if (j === 'affordability') { j = 'realism'; journeyType = 'realism'; isAffordabilityMode = true; }
  else if (j === 'budget')  { journeyType = 'budget'; }
  journey = j;
  document.getElementById('back-btn').style.display = 'block';
  if (label) appendUser(label);

  if (j === 'budget') {
    const wrap = appendGetReal('Do you have a price in mind, or want to know your maximum?');
    appendQuickReplies([
      { label: 'I have a price in mind', action: () => {
          appendUser('I have a price in mind');
          startPimFlow();
        }
      },
      { label: 'Show me my maximum', action: () => {
          appendUser('Show me my maximum');
          startStructuredMaxFlow();
        }
      },
    ], wrap);

  } else if (j === 'realism') {
    const opening = isAffordabilityMode
      ? "Let's work out whether you can actually afford it — deposit, income, and repayments. Tell me the price you're looking at, where it is, and what you've got saved."
      : "Let's check if your savings can get you there. Tell me about the property you have in mind — the price, where it is, and what you\'ve got saved.";
    appendGetReal(opening);
    document.getElementById('user-input').placeholder = 'Tell me about the property…';
    document.getElementById('user-input').focus();

  } else if (j === 'mortgage') {
    appendGetReal(
      "We're building a mortgage and equity tracker — it'll show your current LVR, how extra repayments shorten your loan, and when you can drop LMI.\n\nDrop your email and we'll let you know when it's ready."
    );
    awaitingEmail = true;
    document.getElementById('user-input').placeholder = 'Your email address…';
    document.getElementById('user-input').focus();

  } else if (j === 'selling') {
    const wrap = appendGetReal("One thing that changes a lot about selling is whether the property was ever used as a rental or investment — even just part of the time.\n\nWas this property ever a rental or investment, or have you always lived in it as your home?");
    appendQuickReplies([
      {
        label: 'Always my home',
        action: () => {
          appendUser('Always my home');
          appendGetReal(
            "Good news. If it's always been your main residence, the main residence exemption generally means no CGT — you should keep the full sale price.\n\nThere are edge cases (e.g. if you ever rented part of it out, or it was too large a block) but those are questions for your accountant, not a calculator.\n\nIs there anything else I can help you with?"
          );
        },
      },
      {
        label: 'Was (or is) a rental / investment',
        action: () => {
          appendUser('Was (or is) a rental / investment');
          appendGetReal(
            "Then CGT will likely apply to at least part of the gain — and working out exactly how much depends on when you bought, how long it was rented, and whether you ever moved in.\n\nWe're building a CGT impact calculator for exactly this situation. Drop your email and we'll let you know when it's ready."
          );
          awaitingEmail = true;
          document.getElementById('user-input').placeholder = 'Your email address…';
          document.getElementById('user-input').focus();
        },
      },
    ], wrap);
  }
}

// ─── Message builders ─────────────────────────────────────────────────────────
function appendGetReal(text, extras) {
  const wrap = document.createElement('div');
  wrap.className = 'msg from-getreal';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = 'GETREAL';
  wrap.appendChild(sender);

  if (text) {
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.textContent = text;
    wrap.appendChild(body);
  }

  if (extras) extras(wrap);

  chatEl().appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function appendUser(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg from-user';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = 'YOU';

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.textContent = text;

  wrap.appendChild(sender);
  wrap.appendChild(body);
  chatEl().appendChild(wrap);
  scrollToBottom();
}

function appendThinking() {
  const wrap = document.createElement('div');
  wrap.className = 'thinking';
  wrap.id = 'thinking-indicator';
  wrap.innerHTML = '<div class="msg-sender">GETREAL</div><div class="thinking-dots">Thinking…</div>';
  chatEl().appendChild(wrap);
  scrollToBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function appendError(msg) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = msg;
  chatEl().appendChild(el);
  scrollToBottom();
}

// Append a single step card (for staged reveal)
function appendStepCard(label, value, type) {
  const card = document.createElement('div');
  card.className = 'step-card';
  const lEl = document.createElement('span');
  lEl.className = 'step-card-label';
  lEl.textContent = label;
  const vEl = document.createElement('span');
  vEl.className = 'step-card-value' + (type ? ' ' + type : '');
  vEl.textContent = value;
  card.appendChild(lEl);
  card.appendChild(vEl);
  chatEl().appendChild(card);
  scrollToBottom();
}

// Append the big reveal card
function appendRevealCard(result) {
  const card = document.createElement('div');
  card.className = 'reveal-card';
  card.innerHTML = `
    <div class="reveal-label">Deposit ceiling</div>
    <div class="reveal-price">${fmtMoney(result.maxPrice)}</div>
    <div class="reveal-sub">Based purely on your savings. Income and debts can reduce this further — check the full calculator to see all three ceilings.</div>
  `;
  chatEl().appendChild(card);
  scrollToBottom();
}

// Quick-reply button row
function appendQuickReplies(options, container) {
  const row = document.createElement('div');
  row.className = 'quick-replies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn' + (opt.primary ? ' primary' : '');
    btn.textContent = opt.label;
    btn.onclick = () => {
      row.remove();
      opt.action();
    };
    row.appendChild(btn);
  });
  (container || chatEl()).appendChild(row);
  scrollToBottom();
}

// Repayment figures are pre-computed server-side and passed in the toolResult.

// ─── Staged reveal — gated educational flow ───────────────────────────────────
let revealResult    = null;
let userDTIResponse = null; // 'comfortable' | 'tight' | 'not-yet'

// ─── DTI collection state ─────────────────────────────────────────────────────
const DEBT_TYPES = [
  { key: 'creditCard',   label: 'Credit cards',        hint: 'total limit across all cards' },
  { key: 'carLoan',      label: 'Car loan',              hint: 'remaining balance' },
  { key: 'personalLoan', label: 'Personal loan',         hint: 'remaining balance' },
  { key: 'mortgage',     label: 'Mortgage',              hint: 'remaining balance' },
  { key: 'other',        label: 'Other loan',            hint: 'remaining balance' },
];
let dtiPhase        = null; // 'buyers'|'income1'|'income2'|'debts'|'debt-amount'|'calculating'
let dtiBuyers       = 1;
let dtiIncome1      = 0;
let dtiIncome2      = 0;
let dtiSelectedDebts = [];   // array of DEBT_TYPES keys
let dtiDebtAmounts  = {};
let dtiDebtIndex    = 0;     // which selected debt type we're currently asking about
let lastDTIResult   = null;  // stored after DTI reveal, used by svc binding comparison

// ─── Serviceability collection state ─────────────────────────────────────────
let svcPhase      = null;  // 'takeHome1'|'takeHome2'|'dependants'|'location'|'calculating'
let svcTakeHome1  = 0;
let svcTakeHome2  = 0;
let svcDependants = 0;
let svcLocationType = 'metro';

function doStagedReveal(result) {
  revealResult = result;
  userDTIResponse = null;
  lastCalcResult = result;
  // Realism journey already has a target price — go straight to verdict
  if (result.targetPrice) {
    setTimeout(() => showRealismVerdict(result), 400);
  } else {
    // Budget journey: ask before revealing whether they have a price in mind
    setTimeout(() => askMaxOrTarget(), 400);
  }
}

function askMaxOrTarget() {
  const wrap = appendGetReal("Before I show you the numbers — are you working out your maximum, or do you have a specific price in mind?");
  appendQuickReplies([
    { label: 'Show me my maximum', action: () => {
        appendUser('Show me my maximum');
        showRevealStep(1);
      }
    },
    { label: 'I have a price in mind', action: () => {
        appendUser('I have a price in mind');
        postCalcPhase = 'ask-pre-reveal-target';
        appendGetReal("What's the price? (e.g. $850k, $1.2m)");
        document.getElementById('user-input').placeholder = 'Target price…';
        document.getElementById('user-input').focus();
      }
    },
  ], wrap);
}

function handlePreRevealTarget(text) {
  const price = parseAmount(text);
  if (!price || price < 100000) {
    appendGetReal("Didn't catch that — try something like $850k or $1.2m.");
    return;
  }
  postCalcPhase = null;
  document.getElementById('user-input').placeholder = 'Type a message…';
  lastCalcResult.targetPrice = price;
  lastCalcResult.canAfford   = lastCalcResult.maxPrice >= price;
  lastCalcResult.gapAmount   = Math.max(0, price - lastCalcResult.maxPrice);
  // Run all 3 checks against this target (same as affordability mode)
  isAffordabilityMode = true;
  setTimeout(() => showRealismVerdict(lastCalcResult), 300);
}

// ─── Realism verdict — can they afford the target? ───────────────────────────
function showRealismVerdict(result) {
  const target   = result.targetPrice;
  const ceiling  = result.maxPrice;
  const gap      = result.gapAmount || 0;

  if (result.canAfford) {
    // ✓ They can reach it
    const surplus = ceiling - target;
    const wrap = appendGetReal(
      `Your deposit can reach ${fmtMoney(target)} — you have ${fmtMoney(surplus)} of headroom above that target.`
    );
    // Show the tick card
    setTimeout(() => {
      const card = document.createElement('div');
      card.className = 'reveal-card';
      card.style.borderLeftColor = '#22c55e';
      card.innerHTML = `
        <div class="reveal-label" style="color:#22c55e">DEPOSIT CHECK ✓</div>
        <div class="reveal-price">${fmtMoney(target)}</div>
        <div class="reveal-sub">Your deposit supports up to ${fmtMoney(ceiling)} — this target is within reach on deposit alone. Income and serviceability are still worth checking.</div>
      `;
      chatEl().appendChild(card);
      scrollToBottom();
    }, 400);
    // Affordability mode: auto-continue to income check; otherwise standard reveal
    if (isAffordabilityMode) {
      setTimeout(() => {
        appendGetReal("Deposit: ✓\n\nNow let's check the income side — banks cap your total debt at 6× gross annual income.");
        setTimeout(() => startDTICollection(), 700);
      }, 1000);
    } else {
      setTimeout(() => showRevealStep(2), 1000);
    }

  } else {
    // ✗ Gap — show the shortfall
    const wrap = appendGetReal(
      `Your deposit ceiling is ${fmtMoney(ceiling)} — that's ${fmtMoney(gap)} short of ${fmtMoney(target)}.`
    );
    setTimeout(() => {
      const card = document.createElement('div');
      card.className = 'reveal-card';
      card.style.borderLeftColor = '#ef4444';
      card.innerHTML = `
        <div class="reveal-label" style="color:#ef4444">DEPOSIT GAP</div>
        <div class="reveal-price">−${fmtMoney(gap)}</div>
        <div class="reveal-sub">Deposit ceiling: ${fmtMoney(ceiling)} · Target: ${fmtMoney(target)}</div>
      `;
      chatEl().appendChild(card);
      scrollToBottom();
    }, 400);

    if (isAffordabilityMode) {
      setTimeout(() => {
        appendGetReal(`Your deposit is ${fmtMoney(gap)} short of ${fmtMoney(target)}. You could close that with more savings, a higher LVR lender, or a co-buyer.\n\nLet's still check the income and repayments — they'll tell you if the gap is just the deposit or more than that.`);
        setTimeout(() => startDTICollection(), 900);
      }, 1000);
    } else {
      setTimeout(() => {
        appendGetReal(
          `To reach ${fmtMoney(target)} on deposit alone you'd need roughly ${fmtMoney(gap)} more in savings — though a higher LVR lender or co-buyer could close part of that gap.\n\nLet me still walk you through the repayments and costs so you have the full picture.`
        );
      }, 1000);
      setTimeout(() => showRevealStep(2), 1800);
    }
  }
}

function showRevealStep(step) {
  const result = revealResult;
  const minIncome        = result.minDTIIncome  || 0;
  const monthlyRepayment = result.monthlyRepay  || 0;
  const stressRepayment  = result.stressRepay   || 0;
  const effectiveLoan    = minIncome * 6; // used only for the <$50k guard

  if (step === 0) {
    // ── Teaser ──
    const wrap = appendGetReal(
      "I've got your number. Before I show you, let me walk you through what it actually means — takes about 30 seconds."
    );
    setTimeout(() => {
      appendQuickReplies([{ label: "Let's go →", primary: true, action: () => showRevealStep(1) }], wrap);
    }, 300);

  } else if (step === 1) {
    // ── DTI check ──
    // Guard: if minIncome looks wrong (loan implausibly small), skip to repayments
    if (effectiveLoan < 50000) {
      showRevealStep(2);
      return;
    }
    appendGetReal(
      "Banks check two things beyond your deposit. The first is debt-to-income.\n\nGovernment rules cap total mortgage debt at 6× your gross annual income. For this ceiling, that means:"
    );
    setTimeout(() => {
      appendStepCard('Minimum income needed', fmtMoney(minIncome) + '/yr gross');
    }, 500);
    setTimeout(() => {
      const wrap = appendGetReal(
        "That's if this is your only debt. Any other debt — credit cards, HECS, car loans — pushes that figure higher.\n\nDo you comfortably earn more than " + fmtMoney(minIncome) + " per year?"
      );
      appendQuickReplies([
        { label: 'Yes, comfortably', primary: true, action: () => { appendUser('Yes, comfortably'); userDTIResponse = 'comfortable'; showRevealStep(2); } },
        { label: "It's close",                     action: () => { appendUser("It's close");       userDTIResponse = 'tight';       showRevealStep(2); } },
        { label: 'No, not yet',                    action: () => { appendUser('No, not yet');      userDTIResponse = 'not-yet';     startDTICollection(); } },
      ], wrap);
    }, 1100);

  } else if (step === 2) {
    // ── Serviceability / repayments ──
    appendGetReal("The second check is serviceability — whether the repayments are affordable at a stress-tested rate.");
    setTimeout(() => {
      appendStepCard('Monthly repayment (indicative at 6.25%)', fmtMoney(Math.round(monthlyRepayment)) + '/mo');
    }, 500);
    setTimeout(() => {
      appendStepCard('At stress rate (9.25%)', fmtMoney(Math.round(stressRepayment)) + '/mo');
    }, 1000);
    setTimeout(() => {
      const wrap = appendGetReal(
        "Banks test you at 3% above the current rate. That stress-rate figure needs to be covered comfortably after all your living expenses — rent, food, transport, everything.\n\nMake sense?"
      );
      appendQuickReplies([
        { label: 'Got it →', primary: true, action: () => showRevealStep(3) }
      ], wrap);
    }, 1600);

  } else if (step === 3) {
    // ── Stamp duty breakdown ──
    const dutyLabel = result.isFirstHomeBuyer ? 'Stamp duty (FHB rate applied)' : 'Stamp duty';
    const dutyIsZero = result.stampDuty === 0;

    appendGetReal("Here's what upfront costs do to your savings before you even start.");
    setTimeout(() => {
      appendStepCard('Your savings', fmtMoney(result.savings));
    }, 400);
    setTimeout(() => {
      appendStepCard(dutyLabel, dutyIsZero ? '$0 — exempt' : '−' + fmtMoney(result.stampDuty), dutyIsZero ? '' : 'negative');
    }, 850);
    setTimeout(() => {
      if (result.regFee > 0) appendStepCard('Registration & transfer fees', '−' + fmtMoney(result.regFee), 'negative');
    }, 1200);
    setTimeout(() => {
      if (result.lmiSd > 0) appendStepCard('LMI stamp duty', '−' + fmtMoney(result.lmiSd), 'negative');
    }, 1500);

    const dutyNoteDelay = result.lmiSd > 0 ? 2000 : result.regFee > 0 ? 1800 : 1600;
    setTimeout(() => {
      appendStepCard('Available as deposit', fmtMoney(result.availDeposit), 'result');

      let note = '';
      if (result.isFirstHomeBuyer && dutyIsZero) {
        note = "You're fully exempt from stamp duty as a first home buyer — saving you " + fmtMoney(result.standardDuty) + " vs the standard rate.";
      } else if (result.isFirstHomeBuyer && result.fhbDutySaving > 0) {
        note = "The FHB concession reduced your stamp duty by " + fmtMoney(result.fhbDutySaving) + " — you'd have paid " + fmtMoney(result.standardDuty) + " at the standard rate.";
      } else if (result.isFirstHomeBuyer && !result.fhbDutySaving) {
        note = "No FHB stamp duty concession applies at this price — the property is above the threshold for your state, so you've paid the standard rate.";
      } else {
        note = "That's what's left to put toward the actual purchase.";
      }

      if (result.lmiPremium > 0) {
        const lvrStr = result.lvrTier ? Math.round(result.lvrTier * 100) + '%' : 'above 80%';
        note += " At " + lvrStr + " LVR, LMI also applies — " + fmtMoney(result.lmiPremium) + " capitalised into the loan, not paid upfront.";
      }

      setTimeout(() => {
        const wrap = appendGetReal(note + "\n\nReady to see your ceiling?");
        appendQuickReplies([
          { label: 'Show me →', primary: true, action: () => showRevealStep(4) }
        ], wrap);
      }, 400);
    }, dutyNoteDelay);

  } else if (step === 4) {
    // ── The reveal ──
    setTimeout(() => {
      appendRevealCard(result);
    }, 200);

    setTimeout(() => {
      let context = '';
      if (userDTIResponse === 'comfortable') {
        context = "Based on what you've told me, income probably isn't the binding constraint here — your deposit ceiling is likely the real limit. Use the full calculator to confirm once you've entered your income and debts.";
      } else if (userDTIResponse === 'tight') {
        context = "Given your income is close to the minimum, the DTI or serviceability ceiling may land lower than this number. I'd treat this as an upper bound and check the full calculator before getting anchored to it.";
      } else if (userDTIResponse === 'not-yet') {
        context = "If your income is below the minimum, the DTI ceiling will be the binding constraint — not your deposit. The full calculator will show you the real ceiling based on what you actually earn. This number may be well out of reach.";
      } else {
        context = "This is the ceiling based on deposit alone. Income and debts are separate checks — use the full calculator to see all three ceilings together.";
      }
      appendGetReal(context);
    }, 700);

    setTimeout(() => startPostCalcFlow(result), 1400);
  }
}

// ─── Suburb realism check ─────────────────────────────────────────────────────

// Scoring helpers (mirrored from search.html)
const CHAT_NSW_DAYS = 390;
const CHAT_FALLBACK_CURVE = [
  [0.50,0.02],[0.60,0.05],[0.70,0.12],[0.75,0.18],[0.80,0.26],
  [0.85,0.33],[0.90,0.40],[0.95,0.45],[1.00,0.50],[1.05,0.55],
  [1.10,0.62],[1.15,0.67],[1.20,0.72],[1.30,0.80],[1.40,0.86],
  [1.50,0.90],[1.75,0.94],[2.00,0.97]
];
let CHAT_PRICE_CURVES = null; // loaded lazily

function chatInterpolateCurve(tbl, ratio) {
  if (ratio <= tbl[0][0])              return tbl[0][1];
  if (ratio >= tbl[tbl.length-1][0])  return tbl[tbl.length-1][1];
  for (let i = 0; i < tbl.length-1; i++) {
    if (ratio >= tbl[i][0] && ratio < tbl[i+1][0]) {
      const t = (ratio - tbl[i][0]) / (tbl[i+1][0] - tbl[i][0]);
      return tbl[i][1] + t * (tbl[i+1][1] - tbl[i][1]);
    }
  }
  return 0.50;
}

function chatGetPriceBracket(median) {
  if (median < 500000)  return 'under_500k';
  if (median < 800000)  return '500k_800k';
  if (median < 1200000) return '800k_1200k';
  if (median < 1800000) return '1200k_1800k';
  return 'over_1800k';
}

function chatGetPricePercentile(ratio, ptype, median, annualSales) {
  if (CHAT_PRICE_CURVES && ptype && median && annualSales !== undefined) {
    const bracket = chatGetPriceBracket(median);
    const tier    = annualSales >= 30 ? 'active' : 'thin';
    const ptypes  = ptype === 'townhouse' ? ['townhouse','house'] : [ptype];
    for (const pt of ptypes) {
      const curve = CHAT_PRICE_CURVES[pt]?.[bracket]?.[tier];
      if (curve) return chatInterpolateCurve(curve, ratio);
    }
  }
  return chatInterpolateCurve(CHAT_FALLBACK_CURVE, ratio);
}

async function loadChatPriceCurves() {
  if (CHAT_PRICE_CURVES) return;
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/price_curves?select=property_type,price_bracket,depth_tier,pct_at_05x,pct_at_06x,pct_at_07x,pct_at_08x,pct_at_09x,pct_at_10x,pct_at_11x,pct_at_12x,pct_at_15x`,
      { headers: { apikey: SUPABASE_KEY } }
    );
    const rows = await res.json();
    const COLS = [
      [0.5,'pct_at_05x'],[0.6,'pct_at_06x'],[0.7,'pct_at_07x'],[0.8,'pct_at_08x'],
      [0.9,'pct_at_09x'],[1.0,'pct_at_10x'],[1.1,'pct_at_11x'],[1.2,'pct_at_12x'],[1.5,'pct_at_15x']
    ];
    const cache = {};
    for (const row of rows) {
      const { property_type: pt, price_bracket: br, depth_tier: tier } = row;
      cache[pt] = cache[pt] || {};
      cache[pt][br] = cache[pt][br] || {};
      cache[pt][br][tier] = COLS.map(([ratio, col]) => [ratio, (row[col] ?? 50) / 100]);
    }
    CHAT_PRICE_CURVES = cache;
  } catch(e) {
    // fall through — will use CHAT_FALLBACK_CURVE
  }
}

async function scoreSuburbNSW(suburb, type, ceiling) {
  const cutoff = new Date(Date.now() - CHAT_NSW_DAYS * 864e5).toISOString().slice(0, 10);
  const q = `suburb=ilike.${encodeURIComponent(suburb)}`
          + `&state=eq.NSW`
          + `&property_type=eq.${encodeURIComponent(type)}`
          + `&sale_date=gte.${cutoff}`
          + `&select=sale_price&order=sale_price`;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/property_sales?${q}`, {
    headers: { apikey: SUPABASE_KEY }
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  const rows = await res.json();
  if (!rows.length) return null;
  const prices = rows.map(r => r.sale_price);
  const total  = prices.length;
  const within = prices.filter(p => p <= ceiling).length;
  const sorted = [...prices].sort((a,b)=>a-b);
  const median = sorted[Math.floor(sorted.length / 2)];
  return { total, within, median, score: Math.round(within / total * 100), source: 'exact' };
}

async function scoreSuburbVIC(suburb, type, ceiling) {
  await loadChatPriceCurves();
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/suburb_analytics?state=eq.VIC&suburb=ilike.${encodeURIComponent(suburb)}&property_type=eq.${encodeURIComponent(type)}&select=suburb,median_price,annual_sales_count`,
    { headers: { apikey: SUPABASE_KEY } }
  );
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  const rows = await res.json();
  if (!rows.length) return null;
  const row = rows[0];
  const median = row.median_price;
  const annual = row.annual_sales_count;
  const ratio  = ceiling / median;
  const pct    = chatGetPricePercentile(ratio, type, median, annual);
  const within = Math.round(annual * pct);
  return {
    total: annual, within, median,
    score: Math.round(pct * 100),
    source: 'estimated',
    suburb: row.suburb
  };
}

function suburbScoreLabel(score) {
  if (score >= 75) return { label: 'Highly Realistic', color: '#22c55e' };
  if (score >= 55) return { label: 'Realistic',        color: '#14b8a6' };
  if (score >= 35) return { label: 'Competitive',      color: '#f59e0b' };
  if (score >= 15) return { label: 'Tight',            color: '#f97316' };
  if (score >=  5) return { label: 'Very Difficult',   color: '#ef4444' };
  return                  { label: 'Out of Range',     color: '#b91c1c' };
}

function showSuburbResultCard(suburb, state, type, ceiling, result) {
  const { score, total, within, median, source } = result;
  const { label, color } = suburbScoreLabel(score);
  const displaySuburb = (result.suburb || suburb).replace(/\b\w/g, c => c.toUpperCase());
  const card = document.createElement('div');
  card.className = 'reveal-card';
  card.style.borderLeftColor = color;
  card.innerHTML = `
    <div class="reveal-label" style="color:${color}">${label.toUpperCase()} · ${score}%</div>
    <div class="reveal-price" style="font-size:1.1rem;margin:0.4rem 0">${displaySuburb}, ${state}</div>
    <div class="reveal-sub">
      ${within} of ${total} ${type} sales${state === 'NSW' ? ' (last 13 months)' : ' in 2025 (VGV data)'} were at or below ${fmtMoney(ceiling)}.
      ${median ? 'Median: ' + fmtMoney(median) + '.' : ''}
      ${source === 'estimated' ? ' Score estimated from NSW distribution curves.' : ''}
    </div>
  `;
  chatEl().appendChild(card);
  scrollToBottom();
}

async function runSuburbCheck(suburb) {
  const state   = lastCalcResult && lastCalcResult.state;
  const type    = (lastCalcResult && lastCalcResult.propertyType) || 'house';
  // Use lowest ceiling computed so far
  const c1 = lastCalcResult ? lastCalcResult.maxPrice : null;
  const c2 = lastDTIResult  ? lastDTIResult.maxPrice  : null;
  const c3 = lastSvcResult  ? lastSvcResult.maxPrice  : null;
  const ceiling = Math.min(...[c1, c2, c3].filter(Boolean));

  appendThinking();

  try {
    if (state === 'NSW') {
      const result = await scoreSuburbNSW(suburb, type, ceiling);
      removeThinking();
      if (!result) {
        appendGetReal(`No ${type} sales found for "${suburb}" in NSW. Check the spelling — try the full suburb name (e.g. "Surry Hills", "Castle Hill").`);
        suburbPhase = 'done';
        return;
      }
      showSuburbResultCard(suburb, state, type, ceiling, result);
      appendGetReal(`Based on ${result.total} ${type} sales in ${suburb} over the last 13 months. Your ceiling is ${fmtMoney(ceiling)}.`);
    } else if (state === 'VIC') {
      const result = await scoreSuburbVIC(suburb, type, ceiling);
      removeThinking();
      if (!result) {
        appendGetReal(`No data found for "${suburb}" in VIC. Check the spelling — try title case (e.g. "Fitzroy", "South Yarra").`);
        suburbPhase = 'done';
        return;
      }
      showSuburbResultCard(suburb, state, type, ceiling, result);
      appendGetReal(`Score estimated from VGV 2025 annual sales data and NSW distribution curves. VIC doesn't publish individual sale records — see the full realism checker for methodology details.`);
    } else {
      appendGetReal(`Suburb data is live for NSW and VIC. ${state ? state + ' is on the roadmap' : 'Other states are on the roadmap'} — we'll add them as the data becomes available.`);
    }
    suburbPhase = 'done';
    setTimeout(() => {
      appendCtaLink('/search.html', 'Open full realism checker →');
    }, 400);
  } catch(e) {
    removeThinking();
    appendGetReal(`Couldn't load suburb data right now. Try the realism checker directly.`);
    setTimeout(() => appendCtaLink('/search.html', 'Open realism checker →'), 300);
    suburbPhase = 'done';
  }
}

function handleSFInput(text) {
  if (sf.phase === 'sf-price') {
    const price = parseAmount(text);
    if (!price || price < 100000) { appendGetReal("Try something like $850k or $1.2m."); return; }
    sf.price = price;
    sfAskPropType(); // pim: price → proptype → fork (suburb comes after state)

  } else if (sf.phase === 'sf-suburb') {
    sf.suburb = text.trim().toLowerCase();
    // afford: suburb → oo (proptype already set in pim)
    // max:    suburb → proptype → oo
    // realism-pim: suburb → run check directly
    if (sf.mode === 'afford') { sfAskOO(); }
    else if (sf.mode === 'realism-pim') { sf.phase = null; runPimRealism(); }
    else { sfAskPropType(); }

  } else if (sf.phase === 'sf-savings') {
    const amount = parseAmount(text);
    if (!amount || amount < 1000) { appendGetReal("Enter a dollar amount, e.g. $120,000 or 120k."); return; }
    sf.savings = amount;
    sf.phase = null;
    runStructuredDepositCalc();
  }
}

async function runStructuredDepositCalc() {
  isAffordabilityMode = sf.mode === 'afford';
  sf.phase = 'sf-calculating';

  // Build a single context message containing everything the AI needs
  const fundsFormatted = '$' + sf.savings.toLocaleString('en-AU');
  const who  = sf.isFirstHomeBuyer ? 'a first home buyer' : 'not a first home buyer';
  const use  = sf.isOwnerOccupier  ? 'live in (owner-occupier)' : 'rent out (investment)';
  let contextMsg = `I'm buying in ${sf.state}${sf.suburb ? ', ' + sf.suburb : ''}. I'm ${who}. I'm looking at a ${sf.propertyType} to ${use}. I have ${fundsFormatted} available for the purchase.`;
  if (sf.mode === 'afford' && sf.price) {
    contextMsg += ` My target price is $${sf.price.toLocaleString('en-AU')}.`;
  }

  // Pre-populate conversation — AI sees all facts, skips data collection, runs calc
  conversationHistory = [{ role: 'user', parts: [{ text: contextMsg }] }];
  journeyType = 'budget';

  const knownFacts = [
    'All data has already been collected — do NOT ask for any more information.',
    `State: ${sf.state}.`,
    sf.suburb ? `Suburb: ${sf.suburb}.` : '',
    `Property type: ${sf.propertyType}.`,
    `Owner-occupier: ${sf.isOwnerOccupier}.`,
    `First home buyer: ${sf.isFirstHomeBuyer}.`,
    `Available funds (deposit): ${fundsFormatted}.`,
    sf.mode === 'afford' && sf.price ? `Target price: $${sf.price.toLocaleString('en-AU')}.` : '',
    'Calculate the deposit ceiling immediately and return the tool result.',
    sf.isFirstHomeBuyer ? 'This user is a first home buyer — always include isFirstHomeBuyer: true in the CALC block.' : '',
  ].filter(Boolean).join(' ');

  appendThinking();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory, journeyType: 'budget', knownFacts }),
    });

    removeThinking();
    const data = await res.json();

    if (!data.toolResult) {
      // AI returned text but no calculation — shouldn't happen if knownFacts is heeded
      appendGetReal(data.reply || "Couldn't calculate your ceiling right now — try the full calculator.");
      appendCtaLink('/deposit.html', 'Open full calculator →');
      sf.phase = null;
      return;
    }

    const result = data.toolResult;
    if (!result.propertyType) result.propertyType = sf.propertyType;
    result.isOwnerOccupier = sf.isOwnerOccupier;

    if (sf.mode === 'afford') {
      result.targetPrice = sf.price;
      result.canAfford   = result.maxPrice >= sf.price;
      result.gapAmount   = Math.max(0, sf.price - result.maxPrice);
    }

    sf.phase = null;
    doStagedReveal(result);

  } catch (err) {
    removeThinking();
    sf.phase = null;
    appendGetReal('Could not reach the server. Check your connection and try again.');
    appendError(err.message);
  }
}

function askWhatsNext() {
  postCalcPhase = 'ask-power';
  const wrap = appendGetReal('Want to check if you can actually afford the repayments on that ceiling?');
  appendQuickReplies([
    { label: 'Yes — check serviceability', primary: true, action: () => {

    { label: 'No — check a suburb', action: () => {

        postCalcPhase = 'done';
        offerSuburbCheck();

}

// ─── Amount parser ────────────────────────────────────────────────────────────
function parseAmount(text) {
  const t = text.toLowerCase().replace(/[$,\s]/g, '');
  const m = t.match(/^([\d.]+)\s*([km]?)$/);
  if (!m) return null;
  const n = parseFloat(m[1]);
  if (isNaN(n)) return null;
  if (m[2] === 'k') return Math.round(n * 1000);
  if (m[2] === 'm') return Math.round(n * 1000000);
  return Math.round(n);
}

// ─── DTI collection flow ──────────────────────────────────────────────────────
function startDTICollection() {
  dtiPhase = 'buyers';
  dtiIncome1 = dtiIncome2 = 0;

  dtiDebtAmounts = {};

    { label: 'Buying with a partner / co-buyer', action: () => { appendUser('Buying with a partner / co-buyer'); dtiBuyers = 2; dtiPhase = 'income1'; askIncome1(); } },
  ], wrap);
}

function askIncome1() {
  appendGetReal("What's your gross annual income? (Before tax, excluding super — e.g. $85,000 or 85k)");
  document.getElementById('user-input').placeholder = 'Your annual income…';
  document.getElementById('user-input').focus();

function askDebts() {
  dtiPhase = 'debts';
  const wrap = appendGetReal("Do you have any of these existing debts? Select all that apply, then hit Continue.");

  const grid = document.createElement('div');
  grid.className = 'debt-toggles';

  DEBT_TYPES.forEach(dt => {
    // FHBs can't have an existing mortgage — skip it
    if (dt.key === 'mortgage' && knownFHB) return;
    const btn = document.createElement('button');
    btn.className = 'debt-toggle';
    btn.textContent = dt.label;
    btn.dataset.key = dt.key;
    btn.onclick = () => btn.classList.toggle('selected');
    grid.appendChild(btn);
  });

  // None / Continue row
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:0.4rem;margin-top:0.4rem;';

  const noneBtn = document.createElement('button');
  noneBtn.className = 'qr-btn debt-toggle-none';
  noneBtn.textContent = 'None of these';
  noneBtn.onclick = () => { grid.remove(); row.remove(); dtiSelectedDebts = []; runDTICalc(); };

  const contBtn = document.createElement('button');
  contBtn.className = 'qr-btn primary';
  contBtn.textContent = 'Continue →';
  contBtn.onclick = () => {
    const selected = [...grid.querySelectorAll('.debt-toggle.selected')].map(b => b.dataset.key);
    if (!selected.length) { noneBtn.click(); return; }
    grid.remove(); row.remove();
    dtiSelectedDebts = selected;
    dtiDebtIndex = 0;
    askNextDebt();
  };

  row.appendChild(noneBtn);
  row.appendChild(contBtn);
  wrap.appendChild(grid);
  wrap.appendChild(row);
  scrollToBottom();
}

function askNextDebt() {
  const dt = DEBT_TYPES.find(d => d.key === dtiSelectedDebts[dtiDebtIndex]);

  if (dt.key === 'mortgage') {
    // First confirm they'll keep the mortgaged property after buying
    dtiPhase = 'mortgage-confirm';
    const wrap = appendGetReal("Is this a mortgage on a property you'll still own after you buy? If you're selling that property, we don't need to count it.");
    appendQuickReplies([
      {
        label: "Yes, I'm keeping it",
        action: () => {
          appendUser("Yes, I'm keeping it");
          dtiPhase = 'debt-amount';
          appendGetReal("What's the remaining balance on your mortgage?");
          document.getElementById('user-input').placeholder = 'Amount…';
          document.getElementById('user-input').focus();
        },
      },
      {
        label: "No, I'm selling it",
        action: () => {
          appendUser("No, I'm selling it");
          // Don't count this debt
          dtiDebtIndex++;
          if (dtiDebtIndex < dtiSelectedDebts.length) { askNextDebt(); }
          else { runDTICalc(); }
        },
      },
    ], wrap);
    return;
  }

  dtiPhase = 'debt-amount';
  appendGetReal(`What's the ${dt.hint} on your ${dt.label.toLowerCase()}?`);
  document.getElementById('user-input').placeholder = 'Amount…';
  document.getElementById('user-input').focus();
}

async function runDTICalc() {
  dtiPhase = 'calculating';
  appendThinking();

  const totalDebt = Object.values(dtiDebtAmounts).reduce((s, v) => s + v, 0);
  const incomeStr = dtiBuyers === 2
    ? `${fmtMoney(dtiIncome1)} + ${fmtMoney(dtiIncome2)} = ${fmtMoney(dtiIncome1 + dtiIncome2)} combined`
    : fmtMoney(dtiIncome1);

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        calcType:        'dti',
        savings:          lastCalcResult.savings,
        state:            lastCalcResult.state,
        propertyType:     lastCalcResult.propertyType || 'house',
        isOwnerOccupier:  true,
        isFirstHomeBuyer: lastCalcResult.isFirstHomeBuyer,
        income1:          dtiIncome1,
        income2:          dtiIncome2,
        debts:            dtiDebtAmounts,
      }),
    });

    removeThinking();
    const data = await res.json();

    if (data.error) {
      appendGetReal("Couldn't calculate a ceiling — your income may be too low relative to your debts. The full calculator can show exactly where you stand.");
      appendCtaLink('/deposit.html', 'Open full calculator →');
      return;
    }

    // Walk through steps before revealing the ceiling
    lastDTIResult = data;
    appendGetReal(`Got it — ${incomeStr} income${totalDebt > 0 ? ', $' + totalDebt.toLocaleString('en-AU') + ' in existing debts' : ''}. Let me show you what that means.`);
    setTimeout(() => showDTIRevealSteps(data, 0), 500);

  } catch (err) {
    removeThinking();
    appendError(err.message);
  }
}

function showDTIRevealSteps(result, step) {
  if (step === 0) {
    // ── Repayments ──
    appendGetReal("First, the repayments. At the 6× DTI ceiling, here's what you'd be paying each month:");
    setTimeout(() => appendStepCard('Monthly repayment (indicative at 6.25%)', fmtMoney(result.monthlyRepay) + '/mo'), 500);
    setTimeout(() => appendStepCard('At stress rate (9.25%)', fmtMoney(result.stressRepay) + '/mo'), 1000);
    setTimeout(() => {
      const wrap = appendGetReal(
        "Banks test you at 3% above the current rate. That stress figure needs to be covered after all your living expenses.\n\nMake sense?"
      );
      appendQuickReplies([{ label: 'Got it →', primary: true, action: () => showDTIRevealSteps(result, 1) }], wrap);
    }, 1600);

  } else if (step === 1) {
    // ── Stamp duty ──
    const dutyLabel = result.isFirstHomeBuyer ? 'Stamp duty (FHB rate applied)' : 'Stamp duty';
    const dutyIsZero = result.stampDuty === 0;

    appendGetReal("Now upfront costs — what your savings look like before settlement:");
    setTimeout(() => appendStepCard('Your savings', fmtMoney(result.savings)), 400);
    setTimeout(() => appendStepCard(dutyLabel, dutyIsZero ? '$0 — exempt' : '−' + fmtMoney(result.stampDuty), dutyIsZero ? '' : 'negative'), 850);
    if (result.regFee > 0) setTimeout(() => appendStepCard('Registration & transfer fees', '−' + fmtMoney(result.regFee), 'negative'), 1200);
    if (result.lmiSd > 0) setTimeout(() => appendStepCard('LMI stamp duty', '−' + fmtMoney(result.lmiSd), 'negative'), 1500);

    const delay = result.lmiSd > 0 ? 2000 : result.regFee > 0 ? 1800 : 1400;
    setTimeout(() => {
      let note = '';
      if (result.isFirstHomeBuyer && dutyIsZero) {
        note = "You're fully exempt from stamp duty as a first home buyer — saving you " + fmtMoney(result.standardDuty) + " vs the standard rate.";
      } else if (result.isFirstHomeBuyer && result.fhbDutySaving > 0) {
        note = "The FHB concession reduced your stamp duty by " + fmtMoney(result.fhbDutySaving) + " — you'd have paid " + fmtMoney(result.standardDuty) + " at the standard rate.";
      } else if (result.isFirstHomeBuyer && !result.fhbDutySaving) {
        note = "No FHB concession at this price — above the threshold for your state, so standard rate applies.";
      } else {
        note = "That's what's left to put toward the purchase.";
      }
      if (result.lmiPremium > 0) {
        const lvrStr = result.lvrTier ? Math.round(result.lvrTier * 100) + '%' : 'above 80%';
        note += " At " + lvrStr + " LVR, LMI also applies — " + fmtMoney(result.lmiPremium) + " capitalised into the loan.";
      }
      const wrap = appendGetReal(note + "\n\nReady to see your income ceiling?");
      appendQuickReplies([{ label: 'Show me →', primary: true, action: () => showDTIRevealSteps(result, 2) }], wrap);
    }, delay);

  } else if (step === 2) {
    // ── The reveal ──
    setTimeout(() => appendDTIRevealCard(result), 200);
    setTimeout(() => appendStepCard('Monthly repayment (6.25%)', fmtMoney(result.monthlyRepay) + '/mo'), 600);
    setTimeout(() => appendStepCard('Stressed repayment (9.25%)', fmtMoney(result.stressRepay) + '/mo'), 1000);

    if (isAffordabilityMode && lastCalcResult && lastCalcResult.targetPrice) {
      // Affordability mode: show income verdict vs target, then auto-continue to serviceability
      const target = lastCalcResult.targetPrice;
      const incomeOk = result.maxPrice >= target;
      setTimeout(() => {
        if (incomeOk) {
          const card = document.createElement('div');
          card.className = 'reveal-card';
          card.style.borderLeftColor = '#22c55e';
          card.innerHTML = `
            <div class="reveal-label" style="color:#22c55e">INCOME CHECK ✓</div>
            <div class="reveal-price">${fmtMoney(target)}</div>
            <div class="reveal-sub">Your income supports up to ${fmtMoney(result.maxPrice)} — enough for this target at the 6× DTI cap.</div>
          `;
          chatEl().appendChild(card);
          scrollToBottom();
        } else {
          const incomeGap = target - result.maxPrice;
          const card = document.createElement('div');
          card.className = 'reveal-card';
          card.style.borderLeftColor = '#ef4444';
          card.innerHTML = `
            <div class="reveal-label" style="color:#ef4444">INCOME GAP</div>
            <div class="reveal-price">−${fmtMoney(incomeGap)}</div>
            <div class="reveal-sub">Income supports up to ${fmtMoney(result.maxPrice)} at 6× DTI · Target: ${fmtMoney(target)}</div>
          `;
          chatEl().appendChild(card);
          scrollToBottom();
        }
        setTimeout(() => {
          appendGetReal(`Income: ${incomeOk ? '✓' : '✗'}\n\nLast check — let's see if you can actually service the repayments after living costs.`);
          setTimeout(() => startSvcCollection(), 700);
        }, 600);
      }, 1400);

    } else {
      // Standard mode: show binding constraint + offer serviceability
      setTimeout(() => {
        const isIncomeBound = result.maxPrice < lastCalcResult.maxPrice;
        const grossMonthly  = result.totalIncome / 12;
        const stressPct     = Math.round((result.stressRepay / grossMonthly) * 100);
        let repayRead;
        if (stressPct > 50)      repayRead = `At ${stressPct}% of gross monthly income under stress, this would be very tight.`;
        else if (stressPct > 38) repayRead = `The stressed repayment is ${stressPct}% of gross monthly income — on the higher side.`;
        else                     repayRead = `The stressed repayment is ${stressPct}% of gross monthly income — within a range most lenders consider manageable.`;

        if (isIncomeBound) {
          appendGetReal(`Your income is the binding constraint — this ceiling is lower than your deposit allows.\n\n${repayRead}\n\nThe DTI cap is a regulatory rule, not an affordability check. Serviceability tests whether repayments work after living expenses.`);
        } else {
          appendGetReal(`Your deposit is the binding constraint — your income could support a higher price.\n\n${repayRead}\n\nActual affordability depends on your living expenses — the full serviceability check covers that.`);
        }
      }, 1400);
      setTimeout(() => askWhatsNext(), 2400);
    }
  }
}

function appendDTIRevealCard(result) {
  const card = document.createElement('div');
  card.className = 'reveal-card';
  card.innerHTML = `
    <div class="reveal-label">Income ceiling</div>
    <div class="reveal-price">${fmtMoney(result.maxPrice)}</div>
    <div class="reveal-sub">Based on a ${fmtMoney(result.totalIncome)}/yr income at the 6× DTI limit${result.totalDebt > 0 ? ', after ' + fmtMoney(result.totalDebt) + ' in existing debts' : ''}. Income and deposit ceilings together set your real limit.</div>
  `;
  chatEl().appendChild(card);
  scrollToBottom();
}

function handleDTIInput(text) {
  if (dtiPhase === 'mortgage-confirm') return; // handled by quick reply buttons

  const amount = parseAmount(text);

  if (dtiPhase === 'income1') {
    if (!amount || amount < 1000) { appendGetReal("That doesn't look right — enter a yearly figure, e.g. 85000 or 85k."); return; }
    dtiIncome1 = amount;
    if (dtiBuyers === 2) { dtiPhase = 'income2'; askIncome2(); }
    else { askDebts(); }

  } else if (dtiPhase === 'income2') {
    if (!amount || amount < 0) { appendGetReal("Enter a yearly figure, e.g. 75000 or 75k. Use 0 if they have no income."); return; }
    dtiIncome2 = amount;
    askDebts();

  } else if (dtiPhase === 'debt-amount') {
    if (amount === null || amount < 0) { appendGetReal("Enter a dollar amount, e.g. 15000 or 15k. Use 0 if it's paid off."); return; }
    const key = dtiSelectedDebts[dtiDebtIndex];
    if (amount > 0) dtiDebtAmounts[key] = amount;
    dtiDebtIndex++;
    if (dtiDebtIndex < dtiSelectedDebts.length) {
      askNextDebt();
    } else {
      runDTICalc();
    }
  }
}

      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        calcType:         'serviceability',
        savings:           lastCalcResult.savings,
        state:             lastCalcResult.state,
        propertyType:      lastCalcResult.propertyType || 'house',
        isOwnerOccupier:   lastCalcResult.isOwnerOccupier !== false,
        isFirstHomeBuyer:  lastCalcResult.isFirstHomeBuyer || false,
        takeHome1:         svcTakeHome1,
        takeHome2:         svcTakeHome2,
        householdType:     dtiBuyers === 2 ? 'couple' : 'single',
        dependants:        svcDependants,
        locationType:      svcLocationType,
        debts:             dtiDebtAmounts,
      }),
    });

    removeThinking();
    const data = await res.json();

    if (data.error) {
      appendGetReal("Couldn't calculate a serviceability ceiling: " + data.error);
      appendCtaLink('/deposit.html', 'Open full calculator →');
      postCalcPhase = 'done';
      return;
    }

    appendGetReal("Got it. Let me walk you through what the numbers look like.");
    setTimeout(() => showSvcRevealSteps(data, 0), 500);

  } catch (err) {
    removeThinking();
    appendError(err.message);
    appendCtaLink('/deposit.html', 'Open full calculator →');
    postCalcPhase = 'done';
  }
}

function showSvcRevealSteps(result, step) {
  if (step === 0) {
    // ── HEM breakdown ──
    appendGetReal("The serviceability check uses HEM — a standard living cost benchmark banks apply. Here's what that looks like for your household:");
    setTimeout(() => appendStepCard('HEM benchmark (living costs)', fmtMoney(result.hemMonthly) + '/mo'), 500);
    const existDelay = result.existingMonthly > 0 ? 900 : 0;
    if (result.existingMonthly > 0) {
      setTimeout(() => appendStepCard('Existing debt repayments', '−' + fmtMoney(result.existingMonthly) + '/mo', 'negative'), 900);
    }
    setTimeout(() => appendStepCard('Take-home income', fmtMoney(result.netMonthly) + '/mo'), 900 + existDelay);
    setTimeout(() => {
      appendStepCard(
        'Available for mortgage repayments',
        fmtMoney(result.maxMonthlyRepay) + '/mo',
        result.maxMonthlyRepay > 0 ? 'result' : 'negative'
      );
    }, 1300 + existDelay);
    setTimeout(() => {
      const wrap = appendGetReal("That's what's left after living costs and existing commitments to put toward a mortgage.");
      appendQuickReplies([{ label: 'Got it →', primary: true, action: () => showSvcRevealSteps(result, 1) }], wrap);
    }, 2000 + existDelay);

  } else if (step === 1) {
    lastSvcResult = result;
    // ── Reveal card + repayments + binding constraint ──
    setTimeout(() => appendSvcRevealCard(result), 200);
    setTimeout(() => appendStepCard('Monthly repayment (indicative at 6.25%)', fmtMoney(result.monthlyRepay) + '/mo'), 700);
    setTimeout(() => appendStepCard('At stress rate (9.25%)', fmtMoney(result.stressRepay) + '/mo'), 1200);
    setTimeout(() => {
      const c1Price = lastCalcResult ? lastCalcResult.maxPrice : Infinity;
      const c2Price = lastDTIResult  ? lastDTIResult.maxPrice  : Infinity;
      const c3Price = result.maxPrice;

      let bindingMsg;
      if (c3Price < c1Price && c3Price < c2Price) {
        bindingMsg = `Serviceability is your binding constraint — this is lower than your deposit ceiling. Your maximum based on income is ${fmtMoney(c3Price)}.`;
      } else if (c3Price >= c1Price) {
        bindingMsg = `Serviceability confirmed — you can service the repayments at your deposit ceiling. Your deposit is the binding constraint at ${fmtMoney(c1Price)}.`;
      } else {
        bindingMsg = `Serviceability confirmed at your income ceiling. DTI is the binding constraint at ${fmtMoney(c2Price)}.`;
      }

      if (isAffordabilityMode && lastCalcResult && lastCalcResult.targetPrice) {
        // Affordability mode: show serviceability verdict vs target, then summary
        const target = lastCalcResult.targetPrice;
        const svcOk  = result.maxPrice >= target;
        const depositOk = lastCalcResult.canAfford;
        const incomeOk  = lastDTIResult ? lastDTIResult.maxPrice >= target : null;

        if (svcOk) {
          const card = document.createElement('div');
          card.className = 'reveal-card';
          card.style.borderLeftColor = '#22c55e';
          card.innerHTML = `
            <div class="reveal-label" style="color:#22c55e">REPAYMENTS CHECK ✓</div>
            <div class="reveal-price">${fmtMoney(target)}</div>
            <div class="reveal-sub">Your take-home can cover the repayments at ${fmtMoney(target)} after living costs.</div>
          `;
          chatEl().appendChild(card);
          scrollToBottom();
        } else {
          const svcGap = target - result.maxPrice;
          const card = document.createElement('div');
          card.className = 'reveal-card';
          card.style.borderLeftColor = '#ef4444';
          card.innerHTML = `
            <div class="reveal-label" style="color:#ef4444">REPAYMENTS GAP</div>
            <div class="reveal-price">−${fmtMoney(svcGap)}</div>
            <div class="reveal-sub">Serviceability ceiling: ${fmtMoney(result.maxPrice)} · Target: ${fmtMoney(target)}</div>
          `;
          chatEl().appendChild(card);
          scrollToBottom();
        }

        // Summary
        setTimeout(() => {
          const checks = [
            `Deposit: ${depositOk ? '✓' : '✗  (' + fmtMoney(lastCalcResult.gapAmount) + ' short)'}`,
            incomeOk !== null ? `Income: ${incomeOk ? '✓' : '✗  (income ceiling ' + fmtMoney(lastDTIResult.maxPrice) + ')'}` : null,
            `Repayments: ${svcOk ? '✓' : '✗  (serviceability ceiling ' + fmtMoney(result.maxPrice) + ')'}`,
          ].filter(Boolean).join('\n');

          const allOk = depositOk && (incomeOk !== false) && svcOk;
          const summary = allOk
            ? `All three checks pass for ${fmtMoney(target)}. Based on deposit, income, and repayments — you can reach this target.\n\n${checks}`
            : `Here's the full picture for ${fmtMoney(target)}:\n\n${checks}\n\nThe full calculator shows exactly what you'd need to close any gaps.`;
          appendGetReal(summary);
          setTimeout(() => {
            appendCtaLink('/deposit.html', 'See full breakdown →');
            postCalcPhase = 'done';
            setTimeout(() => offerSuburbCheck(), 400);
          }, 400);
        }, 800);

      } else {
        appendGetReal(bindingMsg + "\n\nThe full calculator shows all three ceilings side by side with a complete cost breakdown.");
        setTimeout(() => {
          appendCtaLink('/deposit.html', 'See full breakdown →');
          postCalcPhase = 'done';
          setTimeout(() => offerSuburbCheck(), 400);
        }, 400);
      }
    }, 1900);
  }
}

function appendSvcRevealCard(result) {
  const card = document.createElement('div');
  card.className = 'reveal-card';
  card.innerHTML = `
    <div class="reveal-label">Serviceability ceiling</div>
    <div class="reveal-price">${fmtMoney(result.maxPrice)}</div>
    <div class="reveal-sub">Based on take-home income of ${fmtMoney(result.netMonthly)}/mo after HEM living costs (${fmtMoney(result.hemMonthly)}/mo)${result.existingMonthly > 0 ? ' and existing debt commitments (' + fmtMoney(result.existingMonthly) + '/mo)' : ''}. Stress-tested at 9.25%.</div>
  `;
  chatEl().appendChild(card);
  scrollToBottom();
}

function handleSvcInput(text) {
  if (svcPhase === 'dependants' || svcPhase === 'location') return; // handled by quick replies

  const amount = parseAmount(text);

  if (svcPhase === 'takeHome1') {
    if (!amount || amount < 100) { appendGetReal("That doesn't look right — enter a monthly figure, e.g. 5000 or 5k."); return; }
    svcTakeHome1 = amount;
    if (dtiBuyers === 2) { askSvcTakeHome2(); }
    else { askSvcDependants(); }

  } else if (svcPhase === 'takeHome2') {
    if (amount === null || amount < 0) { appendGetReal("Enter a monthly figure, e.g. 4500 or 4.5k. Use 0 if they have no income."); return; }
    svcTakeHome2 = amount;
    askSvcDependants();
  }
}

// ─── Email capture ────────────────────────────────────────────────────────────
async function saveToWaitlist(email, tool) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/waitlist`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ email, tool }),
    });
    return true;
  } catch(e) {
    return false;
  }
}

function isValidEmail(e) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}

async function handleEmailInput(text) {
  const email = text.trim();
  if (!isValidEmail(email)) {
    appendGetReal('That doesn\'t look like a valid email — try again.');
    return;
  }
  awaitingEmail = false;
  const ok = await saveToWaitlist(email, journey);
  if (ok) {
    appendGetReal(`Done — ${email} is on the list. We'll reach out when it's ready to test.`);
  } else {
    appendGetReal('Something went wrong saving your email. You can also follow updates at get-real.co.');
  }
}

// ─── AI call ──────────────────────────────────────────────────────────────────
async function callAI(text) {
  conversationHistory.push({ role: 'user', parts: [{ text }] });
  appendThinking();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: conversationHistory,
        journeyType,
        knownFacts: knownFHB ? 'This user is a first home buyer. Do NOT ask whether they are a first home buyer — it is already confirmed. Always include isFirstHomeBuyer: true in the CALC block.' : null,
      }),
    });

    if (!res.ok) {
      const rawText = await res.text().catch(() => '');
      let errMsg = `HTTP ${res.status}`;
      try { errMsg = JSON.parse(rawText).error || errMsg; } catch(e) {
        if (rawText) errMsg = rawText.substring(0, 200);
      }
      removeThinking();
      appendGetReal('Something went wrong. Please try again.');
      appendError(errMsg);
      return;
    }

    const data = await res.json();
    removeThinking();

    const reply = data.reply || '';
    if (reply) conversationHistory.push({ role: 'model', parts: [{ text: reply }] });

    if (data.toolResult) {
      // Don't show the AI's reply — the staged reveal handles all communication from here
      doStagedReveal(data.toolResult);
    } else {
      appendGetReal(reply);
    }

  } catch (err) {
    removeThinking();
    appendGetReal('Could not reach the server. Check your connection and try again.');
    appendError(err.message);
  }
}

// ─── Live number formatting ───────────────────────────────────────────────────
// Formats pure-integer input with commas on every keystroke (including delete).
function liveFormatNumber(el) {
  const raw = el.value;
  const stripped = raw.replace(/[$,\s]/g, '');
  if (!/^\d+$/.test(stripped) || stripped.length < 4) return; // non-numeric or too short
  const formatted = parseInt(stripped, 10).toLocaleString('en-AU');
  if (formatted === raw) return;
  // Preserve cursor distance from end so it doesn't jump to start
  const distFromEnd = raw.length - (el.selectionEnd || raw.length);
  el.value = formatted;
  const newPos = Math.max(0, formatted.length - distFromEnd);
  el.setSelectionRange(newPos, newPos);
}

// ─── Input handling ───────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!waiting) sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  document.getElementById('send-btn').disabled = !el.value.trim() || waiting;
}

function sendMessage() {
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text || waiting) return;
  inp.value = '';
  inp.style.height = '';
  document.getElementById('send-btn').disabled = true;
  appendUser(text);
  handleInput(text);
}

async function handleInput(text) {
  // Structured intake flow
  if (sf.phase && sf.phase !== 'sf-calculating') {
    handleSFInput(text);
    waiting = false;
    document.getElementById('send-btn').disabled = !document.getElementById('user-input').value.trim();
    return;
  }

  // Suburb check collection
  if (suburbPhase === 'awaiting') {
    suburbName = text.trim();
    appendUser(suburbName);
    suburbPhase = 'loading';
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    await runSuburbCheck(suburbName);
    return;
  }

  // DTI collection
  if (dtiPhase && dtiPhase !== 'calculating') {
    handleDTIInput(text);
    waiting = false;
    document.getElementById('send-btn').disabled = !document.getElementById('user-input').value.trim();
    return;
  }

  // Serviceability collection
  if (svcPhase && svcPhase !== 'calculating') {
    handleSvcInput(text);
    waiting = false;
    document.getElementById('send-btn').disabled = !document.getElementById('user-input').value.trim();
    return;
  }

  // Email capture mode (Tools 3 & 4)
  if (awaitingEmail) {
    await handleEmailInput(text);
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // Pre-reveal: user wants to check against a specific target price
  if (postCalcPhase === 'ask-pre-reveal-target') {
    handlePreRevealTarget(text);
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // Post-calc: target price collection
  if (postCalcPhase === 'ask-target') {
    handleTargetPrice(text);
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // Post-calc done — no more AI needed
  if (postCalcPhase === 'done') {
    appendGetReal('Use the links above to continue. Start over any time.');
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // Normal AI chat (Tool 1)
  if (journey === 'budget') {
    waiting = true;
    await callAI(text);
    waiting = false;
    document.getElementById('send-btn').disabled = !document.getElementById('user-input').value.trim();
  }
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
document.getElementById('user-input').addEventListener('input', function () {
  document.getElementById('send-btn').disabled = !this.value.trim() || waiting;
});

// On mobile, scroll to bottom when keyboard opens so latest messages stay visible
document.getElementById('user-input').addEventListener('focus', () => {
  setTimeout(scrollToBottom, 300);
});

boot();
</script>
