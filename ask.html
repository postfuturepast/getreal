<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetReal — buying coach</title>
  <meta name="description" content="Tell GetReal where you are in your property journey. Work out your maximum budget, check if a property is realistic, and more.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      background: #0e0e0e;
      color: #e5e5e5;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .ask-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #1e1e1e;
      background: #0e0e0e;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .ask-header-logo {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }
    .ask-header-tag {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
      margin-left: auto;
    }
    .back-btn {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      padding: 0;
      margin-left: auto;
      display: none;
    }
    .back-btn:hover { color: #e5e5e5; }

    /* ── Tool choice quick replies ── */
    .tool-choices {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.6rem;
    }
    .tool-choice-btn {
      background: #141414;
      border: 1px solid #252525;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.1s, background 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .tool-choice-btn:hover { border-color: #3b82f6; background: #0f1823; color: #fff; }
    .tool-choice-btn.disabled { opacity: 0.45; cursor: default; }
    .tool-choice-btn.disabled:hover { border-color: #252525; background: #141414; color: #d4d4d4; }
    .tool-choice-label { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .tool-choice-tag { font-size: 0.58rem; color: #555; letter-spacing: 0.08em; white-space: nowrap; }

    /* ── Chat area ── */
    .chat-outer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .chat-wrap {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .msg-sender {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #444;
    }
    .msg.from-getreal .msg-sender { color: #3b82f6; }
    .msg.from-user    .msg-sender { color: #555; }
    .msg-body {
      font-size: 0.82rem;
      line-height: 1.7;
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.from-getreal .msg-body { color: #e5e5e5; }
    .msg.from-user    .msg-body { color: #999; }

    /* ── Quick reply buttons ── */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .qr-btn {
      background: #141414;
      border: 1px solid #252525;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
    }
    .qr-btn:hover { border-color: #3b82f6; background: #111; color: #fff; }
    .qr-btn.primary { border-color: #3b82f6; color: #3b82f6; }
    .qr-btn.primary:hover { background: #3b82f6; color: #fff; }

    /* ── Step reveal cards ── */
    .step-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 2px solid #252525;
      padding: 0.65rem 0.9rem;
      margin-top: 0.3rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }
    .step-card-label {
      font-size: 0.68rem;
      color: #aaa;
    }
    .step-card-value {
      font-size: 0.82rem;
      color: #e5e5e5;
      font-weight: 600;
      text-align: right;
    }
    .step-card-value.negative { color: #f87171; }
    .step-card-value.result   { color: #fff; font-size: 1.1rem; }

    /* ── Big reveal card ── */
    .reveal-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 3px solid #3b82f6;
      padding: 0.9rem 1rem;
      margin-top: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .reveal-label {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3b82f6;
      font-weight: 700;
    }
    .reveal-price {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .reveal-sub {
      font-size: 0.65rem;
      color: #888;
      margin-top: 0.25rem;
      line-height: 1.5;
    }

    /* ── Typing indicator ── */
    .thinking {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .thinking .msg-sender { color: #3b82f6; font-size: 0.55rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .thinking-dots {
      font-size: 0.75rem;
      color: #3b82f6;
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ── Input area ── */
    .input-area {
      border-top: 1px solid #1a1a1a;
      background: #0e0e0e;
      padding: 0.9rem 1.25rem;
      position: sticky;
      bottom: 0;
    }
    .input-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    .input-textarea {
      flex: 1;
      background: #141414;
      border: 1px solid #252525;
      color: #e5e5e5;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      padding: 0.65rem 0.85rem;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.1s;
    }
    .input-textarea:focus { border-color: #3b82f6; }
    .input-textarea::placeholder { color: #444; }
    .send-btn {
      background: #3b82f6;
      border: none;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.65rem 1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
      height: 44px;
    }
    .send-btn:hover:not(:disabled) { background: #2563eb; }
    .send-btn:disabled { background: #1e2d46; color: #3b82f6; cursor: not-allowed; }

    /* ── Error ── */
    .error-msg {
      background: #1a0606;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-size: 0.72rem;
      padding: 0.6rem 0.85rem;
    }

    @media (max-width: 480px) {
      .journey-grid { grid-template-columns: 1fr; }
      .chat-wrap { padding: 1rem 0.85rem; }
      .input-area { padding: 0.75rem 0.85rem; }
      .reveal-price { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="ask-header">
  <a class="ask-header-logo" href="/">GetReal</a>
  <button class="back-btn" id="back-btn" onclick="goBack()" style="display:none">← Start over</button>
</div>

<div class="chat-outer" id="chat-outer">
  <div class="chat-wrap" id="chat"></div>
</div>

<div class="input-area" id="input-area">
  <div class="input-inner">
    <textarea
      id="user-input"
      class="input-textarea"
      placeholder="Type a message…"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>Send</button>
  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://lkxzxeeeqfiymunpqvgt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1jyBD0hVdHX2ieqFIlC51A_A3ep39Bc';

// ─── State ────────────────────────────────────────────────────────────────────
let journey      = null;        // 'budget' | 'realism' | 'mortgage' | 'cgt'
let waiting      = false;
let conversationHistory = [];
let postCalcPhase = null;       // null | 'ask-enough' | 'ask-target' | 'ask-power' | 'done'
let lastCalcResult = null;
let awaitingEmail = false;

// ─── Formatters ───────────────────────────────────────────────────────────────
function fmtMoney(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Math.round(n).toLocaleString('en-AU');
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n * 100) + '%';
}

// ─── DOM ──────────────────────────────────────────────────────────────────────
function chatEl()  { return document.getElementById('chat'); }
function scrollToBottom() {
  const outer = document.getElementById('chat-outer');
  outer.scrollTop = outer.scrollHeight;
}

function goBack() {
  journey = null;
  waiting = false;
  conversationHistory = [];
  postCalcPhase = null;
  lastCalcResult = null;
  awaitingEmail = false;
  revealResult = null;
  userDTIResponse = null;
  chatEl().innerHTML = '';
  document.getElementById('user-input').value = '';
  document.getElementById('user-input').style.height = '';
  document.getElementById('user-input').placeholder = 'Type a message…';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('back-btn').style.display = 'none';
  boot();
}

// ─── Boot — show opening message + tool choices ───────────────────────────────
function boot() {
  const wrap = appendGetReal('Where are you in your property journey?');

  const choices = document.createElement('div');
  choices.className = 'tool-choices';

  const tools = [
    { key: 'budget',   label: 'Max budget',       tag: 'Tool 01',     coming: false },
    { key: 'realism',  label: 'Realism check',    tag: 'Tool 02',     coming: false },
    { key: 'mortgage', label: 'Mortgage tracker', tag: 'Coming soon', coming: true  },
    { key: 'cgt',      label: 'CGT calculator',   tag: 'Coming soon', coming: true  },
  ];

  tools.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tool-choice-btn' + (t.coming ? ' disabled' : '');
    btn.innerHTML = `<span class="tool-choice-label">${t.label}</span><span class="tool-choice-tag">${t.tag}</span>`;
    if (!t.coming) {
      btn.onclick = () => {
        choices.remove();
        selectJourney(t.key);
      };
    }
    choices.appendChild(btn);
  });

  wrap.appendChild(choices);
  scrollToBottom();
}

// ─── Journey selection ────────────────────────────────────────────────────────
function selectJourney(j) {
  journey = j;
  document.getElementById('back-btn').style.display = 'block';

  if (j === 'budget') {
    appendUser('Max budget');
    appendGetReal(
      'Your deposit sets the first ceiling on what you can buy — before income or debts even come into it.\n\nTell me a bit about your situation. Where are you buying, and what are you working with?'
    );
    document.getElementById('user-input').placeholder = 'Tell me about your situation…';
    document.getElementById('user-input').focus();

  } else if (j === 'realism') {
    appendUser('Realism check');
    appendGetReal('Enter a suburb and a price in the realism checker and we\'ll show you what share of that market your budget can access.');
    setTimeout(() => appendCtaLink('/search.html', 'Open realism checker →'), 300);

  } else if (j === 'mortgage' || j === 'cgt') {
    const toolName = j === 'mortgage' ? 'Mortgage tracker' : 'CGT calculator';
    appendUser(toolName);
    appendGetReal(
      `The ${toolName} is still in the works — we're building it now.\n\nIf you want to be the first to know when it's ready to test, drop your email below.`
    );
    awaitingEmail = true;
    document.getElementById('user-input').placeholder = 'Your email address…';
    document.getElementById('user-input').focus();
  }
}

// ─── Message builders ─────────────────────────────────────────────────────────
function appendGetReal(text, extras) {
  const wrap = document.createElement('div');
  wrap.className = 'msg from-getreal';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = 'GETREAL';
  wrap.appendChild(sender);

  if (text) {
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.textContent = text;
    wrap.appendChild(body);
  }

  if (extras) extras(wrap);

  chatEl().appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function appendUser(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg from-user';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = 'YOU';

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.textContent = text;

  wrap.appendChild(sender);
  wrap.appendChild(body);
  chatEl().appendChild(wrap);
  scrollToBottom();
}

function appendThinking() {
  const wrap = document.createElement('div');
  wrap.className = 'thinking';
  wrap.id = 'thinking-indicator';
  wrap.innerHTML = '<div class="msg-sender">GETREAL</div><div class="thinking-dots">Thinking…</div>';
  chatEl().appendChild(wrap);
  scrollToBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function appendError(msg) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = msg;
  chatEl().appendChild(el);
  scrollToBottom();
}

// Append a single step card (for staged reveal)
function appendStepCard(label, value, type) {
  const card = document.createElement('div');
  card.className = 'step-card';
  const lEl = document.createElement('span');
  lEl.className = 'step-card-label';
  lEl.textContent = label;
  const vEl = document.createElement('span');
  vEl.className = 'step-card-value' + (type ? ' ' + type : '');
  vEl.textContent = value;
  card.appendChild(lEl);
  card.appendChild(vEl);
  chatEl().appendChild(card);
  scrollToBottom();
}

// Append the big reveal card
function appendRevealCard(result) {
  const card = document.createElement('div');
  card.className = 'reveal-card';
  card.innerHTML = `
    <div class="reveal-label">Deposit ceiling</div>
    <div class="reveal-price">${fmtMoney(result.maxPrice)}</div>
    <div class="reveal-sub">Based purely on your savings. Income and debts can reduce this further — check the full calculator to see all three ceilings.</div>
  `;
  chatEl().appendChild(card);
  scrollToBottom();
}

// Quick-reply button row
function appendQuickReplies(options, container) {
  const row = document.createElement('div');
  row.className = 'quick-replies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn' + (opt.primary ? ' primary' : '');
    btn.textContent = opt.label;
    btn.onclick = () => {
      row.remove();
      opt.action();
    };
    row.appendChild(btn);
  });
  (container || chatEl()).appendChild(row);
  scrollToBottom();
}

// ─── Mortgage calculation helpers ─────────────────────────────────────────────
const INDICATIVE_RATE  = 0.0625; // 6.25% — indicative only
const STRESS_RATE      = 0.0925; // 9.25% — APRA +3% buffer
const LOAN_TERM_MONTHS = 360;    // 30 years

function calcMonthlyRepayment(principal, annualRate) {
  if (!principal || principal <= 0) return 0;
  const r = annualRate / 12;
  return principal * r * Math.pow(1 + r, LOAN_TERM_MONTHS) / (Math.pow(1 + r, LOAN_TERM_MONTHS) - 1);
}

// ─── Staged reveal — gated educational flow ───────────────────────────────────
let revealResult    = null;
let userDTIResponse = null; // 'comfortable' | 'tight' | 'not-yet'

function doStagedReveal(result) {
  revealResult = result;
  userDTIResponse = null;
  lastCalcResult = result;
  setTimeout(() => showRevealStep(0), 400);
}

function showRevealStep(step) {
  const result = revealResult;
  const effectiveLoan    = (result.baseLoan || 0) + (result.lmiPremium || 0);
  const minIncome        = Math.ceil(effectiveLoan / 6 / 1000) * 1000;
  const monthlyRepayment = calcMonthlyRepayment(effectiveLoan, INDICATIVE_RATE);
  const stressRepayment  = calcMonthlyRepayment(effectiveLoan, STRESS_RATE);

  if (step === 0) {
    // ── Teaser ──
    const wrap = appendGetReal(
      "I've got your number. Before I show you, let me walk you through what it actually means — takes about 30 seconds."
    );
    setTimeout(() => {
      appendQuickReplies([{ label: "Let's go →", primary: true, action: () => showRevealStep(1) }], wrap);
    }, 300);

  } else if (step === 1) {
    // ── DTI check ──
    appendGetReal(
      "Banks check two things beyond your deposit. The first is debt-to-income.\n\nGovernment rules cap total mortgage debt at 6× your gross annual income. For this ceiling, that means:"
    );
    setTimeout(() => {
      appendStepCard('Minimum income needed', fmtMoney(minIncome) + '/yr gross');
    }, 500);
    setTimeout(() => {
      const wrap = appendGetReal(
        "That's if this is your only debt. Any other debt — credit cards, HECS, car loans — pushes that figure higher.\n\nDo you comfortably earn more than " + fmtMoney(minIncome) + " per year?"
      );
      appendQuickReplies([
        { label: 'Yes, comfortably', primary: true, action: () => { appendUser('Yes, comfortably'); userDTIResponse = 'comfortable'; showRevealStep(2); } },
        { label: "It's close",                     action: () => { appendUser("It's close");       userDTIResponse = 'tight';       showRevealStep(2); } },
        { label: 'No, not yet',                    action: () => { appendUser('No, not yet');      userDTIResponse = 'not-yet';     showRevealStep(2); } },
      ], wrap);
    }, 1100);

  } else if (step === 2) {
    // ── Serviceability / repayments ──
    appendGetReal("The second check is serviceability — whether the repayments are affordable at a stress-tested rate.");
    setTimeout(() => {
      appendStepCard('Monthly repayment (indicative at 6.25%)', fmtMoney(Math.round(monthlyRepayment)) + '/mo');
    }, 500);
    setTimeout(() => {
      appendStepCard('At stress rate (9.25%)', fmtMoney(Math.round(stressRepayment)) + '/mo');
    }, 1000);
    setTimeout(() => {
      const wrap = appendGetReal(
        "Banks test you at 3% above the current rate. That stress-rate figure needs to be covered comfortably after all your living expenses — rent, food, transport, everything.\n\nMake sense?"
      );
      appendQuickReplies([
        { label: 'Got it →', primary: true, action: () => showRevealStep(3) }
      ], wrap);
    }, 1600);

  } else if (step === 3) {
    // ── Stamp duty breakdown ──
    const dutyLabel = result.isFirstHomeBuyer ? 'Stamp duty (FHB rate applied)' : 'Stamp duty';
    const dutyIsZero = result.stampDuty === 0;

    appendGetReal("Here's what upfront costs do to your savings before you even start.");
    setTimeout(() => {
      appendStepCard('Your savings', fmtMoney(result.savings));
    }, 400);
    setTimeout(() => {
      appendStepCard(dutyLabel, dutyIsZero ? '$0 — exempt' : '−' + fmtMoney(result.stampDuty), dutyIsZero ? '' : 'negative');
    }, 850);
    setTimeout(() => {
      if (result.regFee > 0) appendStepCard('Registration & transfer fees', '−' + fmtMoney(result.regFee), 'negative');
    }, 1200);
    setTimeout(() => {
      if (result.lmiSd > 0) appendStepCard('LMI stamp duty', '−' + fmtMoney(result.lmiSd), 'negative');
    }, 1500);

    const dutyNoteDelay = result.lmiSd > 0 ? 2000 : result.regFee > 0 ? 1800 : 1600;
    setTimeout(() => {
      appendStepCard('Available as deposit', fmtMoney(result.availDeposit), 'result');

      let note = '';
      if (result.isFirstHomeBuyer && dutyIsZero) {
        note = "You're fully exempt from stamp duty as a first home buyer — a significant saving at this price.";
      } else if (result.isFirstHomeBuyer && !dutyIsZero) {
        note = "You've had the FHB rate applied, though at this price point the full exemption threshold may not apply.";
      } else {
        note = "That's what's left to put toward the actual purchase.";
      }

      if (result.lmiPremium > 0) {
        const lvr = result.baseLVR || (result.baseLoan && result.maxPrice ? result.baseLoan / result.maxPrice : null);
        const lvrStr = lvr ? Math.round(lvr * 100) + '%' : 'above 80%';
        note += ` At ${lvrStr} LVR, LMI also applies — ${fmtMoney(result.lmiPremium)} capitalised into the loan, not paid upfront.`;
      }

      setTimeout(() => {
        const wrap = appendGetReal(note + "\n\nReady to see your ceiling?");
        appendQuickReplies([
          { label: 'Show me →', primary: true, action: () => showRevealStep(4) }
        ], wrap);
      }, 400);
    }, dutyNoteDelay);

  } else if (step === 4) {
    // ── The reveal ──
    setTimeout(() => {
      appendRevealCard(result);
    }, 200);

    setTimeout(() => {
      let context = '';
      if (userDTIResponse === 'comfortable') {
        context = "Based on what you've told me, income probably isn't the binding constraint here — your deposit ceiling is likely the real limit. Use the full calculator to confirm once you've entered your income and debts.";
      } else if (userDTIResponse === 'tight') {
        context = "Given your income is close to the minimum, the DTI or serviceability ceiling may land lower than this number. I'd treat this as an upper bound and check the full calculator before getting anchored to it.";
      } else if (userDTIResponse === 'not-yet') {
        context = "If your income is below the minimum, the DTI ceiling will be the binding constraint — not your deposit. The full calculator will show you the real ceiling based on what you actually earn. This number may be well out of reach.";
      } else {
        context = "This is the ceiling based on deposit alone. Income and debts are separate checks — use the full calculator to see all three ceilings together.";
      }
      appendGetReal(context);
    }, 700);

    setTimeout(() => startPostCalcFlow(result), 1400);
  }
}

// ─── Post-calc Q&A ────────────────────────────────────────────────────────────
function startPostCalcFlow(result) {
  postCalcPhase = 'ask-enough';
  const wrap = appendGetReal(`Is ${fmtMoney(result.maxPrice)} enough for what you're looking at?`);
  appendQuickReplies([
    { label: 'Yes, that works', action: () => handleEnough(true) },
    { label: 'No, I need more', action: () => handleEnough(false) },
  ], wrap);
}

function handleEnough(isEnough) {
  postCalcPhase = isEnough ? 'ask-power' : 'ask-target';
  if (!isEnough) {
    appendGetReal('What price are you aiming for?');
  } else {
    askWhatsNext();
  }
}

function handleTargetPrice(text) {
  postCalcPhase = 'ask-power';
  appendGetReal(
    `Got it. Your deposit ceiling is ${fmtMoney(lastCalcResult ? lastCalcResult.maxPrice : 0)} — to push higher you'd need more savings, a higher LVR lender, or a co-buyer. The full calculator can show exactly how much more you'd need to save.`
  );
  setTimeout(() => askWhatsNext(), 700);
}

function appendCtaLink(href, text) {
  const el = document.createElement('a');
  el.href = href;
  el.style.cssText = 'display:block;font-size:0.7rem;color:#3b82f6;text-decoration:none;letter-spacing:0.05em;text-transform:uppercase;margin-top:0.5rem;';
  el.textContent = text;
  chatEl().appendChild(el);
  scrollToBottom();
}

function askWhatsNext() {
  postCalcPhase = 'ask-power';
  const wrap = appendGetReal('Want to check whether you can actually afford the repayments — not just the deposit?');
  appendQuickReplies([
    { label: 'Yes — full calculator', primary: true, action: () => {
        appendGetReal('The full calculator works through all three ceilings — deposit, DTI, and serviceability.');
        setTimeout(() => { appendCtaLink('/deposit.html', 'Open full calculator →'); postCalcPhase = 'done'; }, 300);
      }
    },
    { label: 'No — check my suburb', action: () => {
        appendGetReal('Enter a suburb and price in the realism checker to see what share of that market your budget can access.');
        setTimeout(() => { appendCtaLink('/search.html', 'Open realism checker →'); postCalcPhase = 'done'; }, 300);
      }
    },
  ], wrap);
}

// ─── Email capture ────────────────────────────────────────────────────────────
async function saveToWaitlist(email, tool) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/waitlist`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ email, tool }),
    });
    return true;
  } catch(e) {
    return false;
  }
}

function isValidEmail(e) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}

async function handleEmailInput(text) {
  const email = text.trim();
  if (!isValidEmail(email)) {
    appendGetReal('That doesn\'t look like a valid email — try again.');
    return;
  }
  awaitingEmail = false;
  const ok = await saveToWaitlist(email, journey);
  if (ok) {
    appendGetReal(`Done — ${email} is on the list. We'll reach out when it's ready to test.`);
  } else {
    appendGetReal('Something went wrong saving your email. You can also follow updates at get-real.co.');
  }
}

// ─── AI call ──────────────────────────────────────────────────────────────────
async function callAI(text) {
  conversationHistory.push({ role: 'user', parts: [{ text }] });
  appendThinking();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory }),
    });

    if (!res.ok) {
      const rawText = await res.text().catch(() => '');
      let errMsg = `HTTP ${res.status}`;
      try { errMsg = JSON.parse(rawText).error || errMsg; } catch(e) {
        if (rawText) errMsg = rawText.substring(0, 200);
      }
      removeThinking();
      appendGetReal('Something went wrong. Please try again.');
      appendError(errMsg);
      return;
    }

    const data = await res.json();
    removeThinking();

    const reply = data.reply || '';
    if (reply) conversationHistory.push({ role: 'model', parts: [{ text: reply }] });

    if (data.toolResult) {
      if (reply) appendGetReal(reply);
      doStagedReveal(data.toolResult);
    } else {
      appendGetReal(reply);
    }

  } catch (err) {
    removeThinking();
    appendGetReal('Could not reach the server. Check your connection and try again.');
    appendError(err.message);
  }
}

// ─── Input handling ───────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!waiting) sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  document.getElementById('send-btn').disabled = !el.value.trim() || waiting;
}

function sendMessage() {
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text || waiting) return;
  inp.value = '';
  inp.style.height = '';
  document.getElementById('send-btn').disabled = true;
  appendUser(text);
  handleInput(text);
}

async function handleInput(text) {
  // Email capture mode (Tools 3 & 4)
  if (awaitingEmail) {
    await handleEmailInput(text);
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // Post-calc: target price collection
  if (postCalcPhase === 'ask-target') {
    handleTargetPrice(text);
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // Post-calc done — no more AI needed
  if (postCalcPhase === 'done') {
    appendGetReal('Use the links above to continue. Start over any time.');
    waiting = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  // Normal AI chat (Tool 1)
  if (journey === 'budget') {
    waiting = true;
    await callAI(text);
    waiting = false;
    document.getElementById('send-btn').disabled = !document.getElementById('user-input').value.trim();
  }
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
document.getElementById('user-input').addEventListener('input', function () {
  document.getElementById('send-btn').disabled = !this.value.trim() || waiting;
});

boot();
</script>
