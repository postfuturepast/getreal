name: NSW Enrichment Matching

on:
  schedule:
    # Every Monday at 4am AEST (Sunday 18:00 UTC)
    # Runs after refresh-nsw-data.yml (Sunday 2am AEST / 16:00 UTC) completes
    - cron: '0 18 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run NSW enrichment matching
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python3 match_nsw_enrichment.py

      - name: Log completion
        run: echo "NSW enrichment complete — $(date)"
