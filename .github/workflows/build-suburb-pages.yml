name: Rebuild Suburb Pages

on:
  schedule:
    - cron: '0 20 * * 0'  # Sunday 20:00 UTC = Monday 6am AEST (after enrichment)
  workflow_dispatch:       # Manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build suburb pages
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python3 build_suburbs.py

      - name: Commit and push (single deployment)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add suburbs/ sitemap-suburbs.xml
          git diff --cached --quiet && echo "No changes — skipping deploy" || (
            git commit -m "chore: rebuild suburb pages $(date -u +%Y-%m-%d)" &&
            git push
          )
