name: Rebuild Static Pages

on:
  schedule:
    - cron: '0 20 * * 0'  # Sunday 20:00 UTC = Monday 6am AEST
  workflow_dispatch:       # Manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      # ── Step 1: Refresh reference data in Supabase ───────────────────────────
      # Must run before any page builds so pages read the latest rate.

      - name: Fetch RBA cash rate
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python3 fetch_rba_cash_rate.py

      # ── Step 2: Build all static page sets ───────────────────────────────────
      # All builders read live data from Supabase (including the rate we just
      # refreshed). Run in sequence so a failure in one doesn't corrupt git.

      - name: Build suburb pages
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python3 build_suburbs.py

      - name: Build income guide pages (Series A)
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python3 build_income_guides.py

      - name: Build price guide pages (Series B)
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python3 build_price_guides.py

      # ── Step 3: Single commit + push = one Cloudflare deployment ─────────────

      - name: Commit and push (single deployment)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add suburbs/ sitemap-suburbs.xml
          git add guides/how-much-can-i-borrow/ sitemap-guides-a.xml || true
          git add guides/can-i-afford/ sitemap-guides-b.xml || true
          git diff --cached --quiet && echo "No changes — skipping deploy" || (
            git commit -m "chore: rebuild static pages $(date -u +%Y-%m-%d)" &&
            git push
          )
