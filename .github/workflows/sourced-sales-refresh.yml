name: Sourced Sales — Monthly Refresh (All Agencies)

# Covers all non-Ray White agency scrapers. Ray White runs separately
# (weekly, incremental) via raywhite-incremental.yml.
# Raine & Horne excluded — negligible data.
#
# NOTIFICATIONS
# After each run, this workflow updates a pinned GitHub issue with a stats
# table (new records per agency, per state). GitHub emails you when the issue
# is updated — no extra credentials needed.

on:
  schedule:
    # Every Sunday at 2am AEST (Sunday 16:00 UTC)
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      scraper:
        description: >
          Run a specific scraper only:
          nelsonalexander | barryplant | jelliscraig | harcourts |
          ljhooker | mcgrath | mcgrath_franchise
          Leave blank for all.
        required: false
        default: ''
      since:
        description: 'Barry Plant only: fetch listings from last N days (default: 21)'
        required: false
        default: '21'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      issues: write   # needed to create/update the report issue

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 curl-cffi

      # ── Restore cached state files from previous run ───────────────────────
      - name: Restore scraper state files
        uses: actions/cache@v4
        with:
          path: |
            .nelsonalexander_state.json
            .jelliscraig_state.json
            .barryplant_state.json
            .harcourts_state.json
          key: sourced-sales-state-${{ github.run_id }}
          restore-keys: |
            sourced-sales-state-

      # ── VIC-only agencies ──────────────────────────────────────────────────

      - name: Nelson Alexander (VIC)
        if: ${{ github.event.inputs.scraper == '' || github.event.inputs.scraper == 'nelsonalexander' }}
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python3 fetch_nelsonalexander.py --resume 2>&1 | tee /tmp/na_out.txt
          DONE=$(grep -E '^Done:' /tmp/na_out.txt | tail -1 || echo "no output")
          echo "NA_RESULT=$DONE" >> $GITHUB_ENV

      - name: Jellis Craig (VIC)
        if: ${{ github.event.inputs.scraper == '' || github.event.inputs.scraper == 'jelliscraig' }}
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python3 fetch_jelliscraig.py --resume 2>&1 | tee /tmp/jc_out.txt
          DONE=$(grep -E '^Done:' /tmp/jc_out.txt | tail -1 || echo "no output")
          echo "JC_RESULT=$DONE" >> $GITHUB_ENV

      # ── National agencies ──────────────────────────────────────────────────

      - name: Barry Plant (all states, incremental)
        if: ${{ github.event.inputs.scraper == '' || github.event.inputs.scraper == 'barryplant' }}
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          SINCE="${{ github.event.inputs.since || '21' }}"
          python3 fetch_barryplant.py --resume --since "$SINCE" 2>&1 | tee /tmp/bp_out.txt
          DONE=$(grep -E '^Done:' /tmp/bp_out.txt | tail -1 || echo "no output")
          echo "BP_RESULT=$DONE" >> $GITHUB_ENV

      - name: Harcourts (all states)
        if: ${{ github.event.inputs.scraper == '' || github.event.inputs.scraper == 'harcourts' }}
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python3 fetch_harcourts.py 2>&1 | tee /tmp/hc_out.txt
          DONE=$(grep -E '^Done:' /tmp/hc_out.txt | tail -1 || echo "no output")
          echo "HC_RESULT=$DONE" >> $GITHUB_ENV

      - name: LJ Hooker (all states)
        if: ${{ github.event.inputs.scraper == '' || github.event.inputs.scraper == 'ljhooker' }}
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python3 fetch_ljhooker_all_states.py 2>&1 | tee /tmp/ljh_out.txt
          DONE=$(grep -E '^Done:' /tmp/ljh_out.txt | tail -1 || echo "no output")
          echo "LJH_RESULT=$DONE" >> $GITHUB_ENV

      - name: McGrath (all states)
        if: ${{ github.event.inputs.scraper == '' || github.event.inputs.scraper == 'mcgrath' }}
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python3 fetch_mcgrath.py 2>&1 | tee /tmp/mg_out.txt
          DONE=$(grep -E '^Done:' /tmp/mg_out.txt | tail -1 || echo "no output")
          echo "MG_RESULT=$DONE" >> $GITHUB_ENV

      - name: McGrath Franchise (all states)
        if: ${{ github.event.inputs.scraper == '' || github.event.inputs.scraper == 'mcgrath_franchise' }}
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python3 fetch_mcgrath_franchise.py 2>&1 | tee /tmp/mgf_out.txt
          DONE=$(grep -E '^Done:' /tmp/mgf_out.txt | tail -1 || echo "no output")
          echo "MGF_RESULT=$DONE" >> $GITHUB_ENV

      # ── Save state files for next run ──────────────────────────────────────
      - name: Save scraper state files
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            .nelsonalexander_state.json
            .jelliscraig_state.json
            .barryplant_state.json
            .harcourts_state.json
          key: sourced-sales-state-${{ github.run_id }}

      # ── Upload NDJSON artifacts ────────────────────────────────────────────
      - name: Upload NDJSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sourced-sales-ndjson-${{ github.run_id }}
          path: |
            nelsonalexander_listings.ndjson
            jelliscraig_listings.ndjson
            barryplant_listings.ndjson
            harcourts_listings.ndjson
            ljhooker_listings.ndjson
            mcgrath_listings.ndjson
            mcgrath_franchise_listings.ndjson
          retention-days: 14
          if-no-files-found: ignore

      # ── Post report to GitHub issue ────────────────────────────────────────
      # Updates a single pinned issue with the latest run stats.
      # GitHub emails you when the issue is updated — no extra secrets needed.
      - name: Post run report to GitHub issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status   = '${{ job.status }}';
            const emoji    = status === 'success' ? '✅' : '⚠️';
            const runDate  = new Date().toLocaleDateString('en-AU', {
              timeZone: 'Australia/Melbourne',
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });

            const rows = [
              ['Nelson Alexander', 'VIC',      process.env.NA_RESULT  || '—'],
              ['Jellis Craig',     'VIC',      process.env.JC_RESULT  || '—'],
              ['Barry Plant',      'All states', process.env.BP_RESULT || '—'],
              ['Harcourts',        'All states', process.env.HC_RESULT || '—'],
              ['LJ Hooker',        'All states', process.env.LJH_RESULT || '—'],
              ['McGrath',          'All states', process.env.MG_RESULT  || '—'],
              ['McGrath Franchise','All states', process.env.MGF_RESULT || '—'],
            ];

            const table = [
              '| Agency | States | Result |',
              '|--------|--------|--------|',
              ...rows.map(([a, s, r]) => `| ${a} | ${s} | ${r} |`),
            ].join('\n');

            const body = [
              `## ${emoji} Sourced Sales Refresh — ${runDate} AEST`,
              '',
              `**Status:** ${status}  `,
              `**Run:** [View full logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              '',
              table,
              '',
              '---',
              '_This issue is updated automatically after each monthly run._',
            ].join('\n');

            // Find existing report issue (label: pipeline-report) or create one
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pipeline-report',
              state: 'open',
              per_page: 1,
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title: `Sourced sales refresh — ${runDate} AEST — ${status}`,
                body,
              });
              console.log(`Updated issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Sourced sales refresh — ${runDate} AEST — ${status}`,
                body,
                labels: ['pipeline-report'],
              });
              console.log(`Created issue #${issue.number}`);
            }
